<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f3f7fc">

  <title>ATWORK | ตรวจสอบสถานะ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{
      --bg:#f3f7fc;
      --surface:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e2e8f0;

      --blue:#2563eb;
      --blue-soft:#eff6ff;

      --green:#16a34a;
      --green-soft:#ecfdf3;

      --red:#dc2626;
      --red-soft:#fef2f2;

      --shadow:0 18px 55px rgba(15,23,42,.08);
      --radius-xl:28px;
      --radius-lg:20px;
      --radius-md:15px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;

      color:var(--text);

      background:
        radial-gradient(
          500px 260px at -5% -5%,
          rgba(37,99,235,.13),
          transparent 72%
        ),
        radial-gradient(
          460px 260px at 105% 0%,
          rgba(59,130,246,.10),
          transparent 72%
        ),
        linear-gradient(
          180deg,
          #f8fbff 0%,
          #f3f7fc 48%,
          #eef4fa 100%
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      -webkit-font-smoothing:antialiased;
    }

    button{
      font:inherit;
      touch-action:manipulation;
    }

    .container{
      width:min(760px,100%);
      margin:0 auto;
      padding:14px 14px 42px;
    }

    /* =========================
       HERO
    ========================= */

    .hero{
      position:relative;
      overflow:hidden;

      padding:24px 22px 20px;

      border:1px solid rgba(255,255,255,.9);
      border-radius:30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.98),
          rgba(247,251,255,.96)
        );

      box-shadow:var(--shadow);
    }

    .hero::before{
      content:"";

      position:absolute;

      width:250px;
      height:250px;

      right:-120px;
      top:-150px;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(37,99,235,.18),
          rgba(37,99,235,0) 70%
        );
    }

    .brand-kicker{
      display:inline-flex;
      align-items:center;
      gap:7px;

      margin-bottom:10px;

      color:var(--blue);

      font-size:10.5px;
      font-weight:900;

      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .brand-kicker::before{
      content:"";

      width:18px;
      height:2px;

      border-radius:999px;

      background:var(--blue);
    }

    .brand{
      font-size:34px;
      line-height:1;
      font-weight:950;
      letter-spacing:-.035em;
    }

    .hero-title{
      margin-top:12px;

      font-size:20px;
      line-height:1.3;
      font-weight:900;
    }

    .hero-copy{
      margin-top:6px;

      color:var(--muted);

      font-size:13px;
      line-height:1.65;
    }

    /* =========================
       LINE USER
    ========================= */

    .line-user{
      display:flex;
      align-items:center;
      gap:12px;

      margin-top:18px;
      padding:12px 13px;

      border:1px solid #e4ebf3;
      border-radius:16px;

      background:rgba(255,255,255,.84);
    }

    .line-user img{
      width:46px;
      height:46px;

      object-fit:cover;

      border-radius:50%;

      background:#eef2f7;
      flex:0 0 auto;
    }

    .line-name{
      font-size:14px;
      font-weight:900;
    }

    .connection{
      display:flex;
      align-items:center;
      gap:6px;

      margin-top:4px;

      color:var(--green);

      font-size:11.5px;
      font-weight:750;
    }

    .connection::before{
      content:"";

      width:6px;
      height:6px;

      border-radius:50%;

      background:currentColor;
    }

    /* =========================
       MAIN CARD
    ========================= */

    .card{
      margin-top:15px;

      padding:9px;

      border:1px solid rgba(226,232,240,.98);
      border-radius:30px;

      background:rgba(255,255,255,.88);

      box-shadow:var(--shadow);
    }

    .card-inner{
      padding:22px 20px 20px;
    }

    .section-head{
      display:flex;
      align-items:flex-start;
      gap:13px;

      margin-bottom:17px;
    }

    .section-icon{
      width:40px;
      height:40px;

      display:grid;
      place-items:center;

      flex:0 0 auto;

      border-radius:13px;

      background:
        linear-gradient(
          145deg,
          #eff6ff,
          #dbeafe
        );

      color:#1d4ed8;

      font-size:19px;
      font-weight:950;

      box-shadow:
        inset 0 0 0 1px rgba(37,99,235,.10);
    }

    .section-title{
      margin:0;

      font-size:18px;
      line-height:1.3;
      font-weight:900;
      letter-spacing:-.02em;
    }

    .section-desc{
      margin-top:5px;

      color:var(--muted);

      font-size:12px;
      line-height:1.6;
    }

    /* =========================
       REFRESH BUTTON
    ========================= */

    .refresh-button{
      width:100%;
      min-height:52px;

      border:1px solid #cbd5e1;
      border-radius:14px;

      background:#fff;
      color:#0f172a;

      font-size:14px;
      font-weight:900;

      cursor:pointer;

      transition:
        transform .16s ease,
        box-shadow .16s ease,
        border-color .16s ease,
        opacity .16s ease;
    }

    .refresh-button:not(:disabled):hover{
      transform:translateY(-1px);

      border-color:#93b4de;

      box-shadow:
        0 12px 24px rgba(37,99,235,.08);
    }

    .refresh-button:disabled{
      opacity:.55;
      cursor:wait;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message{
      display:none;

      margin-top:14px;

      padding:12px 14px;

      border-radius:13px;

      font-size:12px;
      line-height:1.55;
    }

    .message.show{
      display:block;
    }

    .message.info{
      border:1px solid #bfdbfe;
      background:var(--blue-soft);
      color:#1d4ed8;
    }

    .message.success{
      border:1px solid #bbf7d0;
      background:var(--green-soft);
      color:#15803d;
    }

    .message.error{
      border:1px solid #fecaca;
      background:var(--red-soft);
      color:#b91c1c;
    }

    /* =========================
       APPLICATION LIST
    ========================= */

    .applications{
      display:grid;
      gap:10px;

      margin-top:14px;
    }

    .application-card{
      padding:15px;

      border:1px solid #e2e8f0;
      border-radius:17px;

      background:
        linear-gradient(
          180deg,
          #fbfdff,
          #f7faff
        );
    }

    .application-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;

      gap:12px;
    }

    .application-position{
      margin:0;

      font-size:14.5px;
      line-height:1.45;
      font-weight:900;
    }

    .application-id{
      margin-top:4px;

      color:#94a3b8;

      font-size:10.5px;
      line-height:1.4;

      word-break:break-all;
    }

    .status-badge{
      flex:0 0 auto;

      padding:6px 10px;

      border-radius:999px;

      background:#eff6ff;
      border:1px solid #dbeafe;

      color:#1d4ed8;

      font-size:10.5px;
      font-weight:900;

      white-space:nowrap;
    }

    .meta-grid{
      display:grid;

      grid-template-columns:1fr 1fr;

      gap:8px;

      margin-top:13px;
    }

    .meta-item{
      padding:9px 10px;

      border:1px solid #edf2f7;
      border-radius:12px;

      background:#fff;
    }

    .meta-label{
      display:block;

      color:#94a3b8;

      font-size:9.5px;
      font-weight:800;
    }

    .meta-value{
      display:block;

      margin-top:3px;

      color:#334155;

      font-size:11.5px;
      font-weight:850;

      word-break:break-word;
    }

    /* =========================
       DETAIL BUTTON
    ========================= */

    .detail-button{
      width:100%;

      min-height:44px;

      margin-top:12px;

      border:1px solid #d8e3ef;
      border-radius:12px;

      background:#fff;

      color:#1e3a8a;

      font-size:12px;
      font-weight:900;

      cursor:pointer;

      transition:
        transform .16s ease,
        box-shadow .16s ease,
        border-color .16s ease;
    }

    .detail-button:hover{
      transform:translateY(-1px);

      border-color:#9ab7de;

      box-shadow:
        0 10px 22px rgba(37,99,235,.08);
    }

    /* =========================
       LOADING
    ========================= */

    .loading{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;

      padding:28px 10px;

      color:var(--muted);

      font-size:12px;
      font-weight:800;
    }

    .spinner{
      width:18px;
      height:18px;

      border:3px solid #dbe5f1;
      border-top-color:var(--blue);

      border-radius:50%;

      animation:spin .75s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    .empty{
      padding:30px 14px;

      text-align:center;

      color:var(--muted);

      font-size:13px;
      line-height:1.6;
    }

    /* =========================
       DETAIL MODAL
    ========================= */

    .detail-overlay{
      position:fixed;
      inset:0;

      z-index:9999;

      display:flex;
      align-items:flex-end;
      justify-content:center;

      background:rgba(15,23,42,.46);

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      opacity:0;
      visibility:hidden;
      pointer-events:none;

      transition:
        opacity .2s ease,
        visibility .2s ease;
    }

    .detail-overlay.show{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .detail-modal{
      width:min(760px,100%);

      max-height:90vh;
      overflow-y:auto;

      padding:10px 10px 18px;

      border-radius:28px 28px 0 0;

      background:#fff;

      box-shadow:
        0 -20px 80px rgba(15,23,42,.20);

      transform:translateY(30px);

      transition:
        transform .22s cubic-bezier(.2,.8,.2,1);
    }

    .detail-overlay.show .detail-modal{
      transform:none;
    }

    .detail-handle{
      width:42px;
      height:4px;

      margin:4px auto 15px;

      border-radius:999px;

      background:#dbe3ec;
    }

    .detail-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;

      gap:12px;

      padding:6px 8px 17px;
    }

    .detail-header-title{
      margin:0;

      font-size:19px;
      line-height:1.35;
      font-weight:950;
    }

    .detail-header-id{
      margin-top:5px;

      color:#94a3b8;

      font-size:10.5px;
      word-break:break-all;
    }

    .close-button{
      width:38px;
      height:38px;

      flex:0 0 auto;

      border:1px solid #e2e8f0;
      border-radius:12px;

      background:#f8fafc;
      color:#475569;

      font-size:20px;
      font-weight:900;

      cursor:pointer;
    }

    .detail-section{
      margin-top:10px;

      padding:15px;

      border:1px solid #e5ebf2;
      border-radius:17px;

      background:#fbfdff;
    }

    .detail-section-title{
      margin:0 0 12px;

      font-size:13px;
      font-weight:950;
      color:#1e293b;
    }

    .detail-grid{
      display:grid;

      grid-template-columns:1fr 1fr;

      gap:8px;
    }

    .detail-item{
      min-width:0;

      padding:9px 10px;

      border-radius:12px;

      background:#fff;

      border:1px solid #edf2f7;
    }

    .detail-item.full{
      grid-column:1/-1;
    }

    .detail-label{
      display:block;

      color:#94a3b8;

      font-size:9.5px;
      font-weight:800;
    }

    .detail-value{
      display:block;

      margin-top:3px;

      color:#334155;

      font-size:11.5px;
      font-weight:850;

      line-height:1.55;

      word-break:break-word;
    }

    .detail-status{
      display:inline-flex;

      padding:7px 11px;

      border-radius:999px;

      background:#eff6ff;
      border:1px solid #dbeafe;

      color:#1d4ed8;

      font-size:11px;
      font-weight:950;
    }

    /* =========================
       RESUME
    ========================= */

    .resume-card{
      padding:12px;

      border:1px solid #e2e8f0;
      border-radius:14px;

      background:#fff;
    }

    .resume-name{
      color:#334155;

      font-size:12px;
      font-weight:900;

      word-break:break-word;
    }

    .resume-status{
      margin-top:4px;

      color:#64748b;

      font-size:10.5px;
    }

    .resume-open{
      display:flex;
      align-items:center;
      justify-content:center;

      width:100%;

      min-height:42px;

      margin-top:10px;

      border-radius:11px;

      background:#0f172a;
      color:#fff;

      font-size:11px;
      font-weight:900;

      text-decoration:none;
    }

    .no-resume{
      padding:18px 10px;

      text-align:center;

      color:var(--muted);

      font-size:12px;
    }

    .hidden{
      display:none !important;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:620px){

      .container{
        padding:10px 9px 30px;
      }

      .hero{
        padding:20px 17px 17px;
        border-radius:24px;
      }

      .brand{
        font-size:30px;
      }

      .hero-title{
        font-size:19px;
      }

      .card{
        padding:7px;
        border-radius:24px;
      }

      .card-inner{
        padding:19px 14px 18px;
      }

      .meta-grid{
        grid-template-columns:1fr;
      }

      .detail-modal{
        max-height:92vh;
        border-radius:24px 24px 0 0;
      }

      .detail-grid{
        grid-template-columns:1fr;
      }

      .detail-item.full{
        grid-column:auto;
      }
    }
  </style>
</head>


<body>

  <main class="container">

    <!-- =========================
         HEADER
    ========================= -->

    <header class="hero">

      <div class="brand-kicker">
        Recruitment
      </div>

      <div class="brand">
        @attwork
      </div>

      <div class="hero-title">
        ตรวจสอบสถานะการสมัคร
      </div>

      <div class="hero-copy">
        ตรวจสอบใบสมัครของคุณที่เชื่อมกับบัญชี LINE
      </div>


      <div
        id="lineUser"
        class="line-user hidden"
      >

        <img
          id="linePicture"
          src=""
          alt="LINE profile"
        >

        <div>

          <div
            id="lineDisplayName"
            class="line-name"
          >
            ผู้ใช้ LINE
          </div>

          <div
            id="connectionStatus"
            class="connection"
          >
            กำลังเชื่อมต่อ LINE...
          </div>

        </div>

      </div>

    </header>


    <!-- =========================
         STATUS
    ========================= -->

    <section class="card">

      <div class="card-inner">

        <div class="section-head">

          <div
            class="section-icon"
            aria-hidden="true"
          >
            ✓
          </div>

          <div>

            <h1 class="section-title">
              ใบสมัครของฉัน
            </h1>

            <div class="section-desc">
              แสดงเฉพาะใบสมัครที่ผูกกับบัญชี LINE นี้
            </div>

          </div>

        </div>


        <button
          id="refreshButton"
          class="refresh-button"
          type="button"
          disabled
        >
          กำลังเชื่อมต่อ LINE...
        </button>


        <div
          id="message"
          class="message"
          aria-live="polite"
        ></div>


        <div
          id="applications"
          class="applications"
        >

          <div class="loading">

            <div class="spinner"></div>

            <span>
              กำลังเตรียมระบบ...
            </span>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       DETAIL MODAL
  ========================= -->

  <div
    id="detailOverlay"
    class="detail-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="detailTitle"
  >

    <div class="detail-modal">

      <div class="detail-handle"></div>


      <div class="detail-header">

        <div>

          <h2
            id="detailTitle"
            class="detail-header-title"
          >
            รายละเอียดใบสมัคร
          </h2>

          <div
            id="detailApplicationId"
            class="detail-header-id"
          >
            -
          </div>

        </div>


        <button
          id="closeDetailButton"
          class="close-button"
          type="button"
          aria-label="ปิด"
        >
          ×
        </button>

      </div>


      <!-- APPLICATION DETAIL -->

      <section class="detail-section">

        <h3 class="detail-section-title">
          ข้อมูลใบสมัคร
        </h3>

        <div
          id="detailApplication"
          class="detail-grid"
        ></div>

      </section>


      <!-- RESUME -->

      <section class="detail-section">

        <h3 class="detail-section-title">
          Resume
        </h3>

        <div id="detailResume"></div>

      </section>

    </div>

  </div>


  <!-- Hidden iframe -->
  <iframe
    id="postFrame"
    name="atworkPostFrame"
    style="display:none"
    title="ATWORK background request"
  ></iframe>


  <script>

    /* =========================================================
       CONFIG
    ========================================================= */

    const LIFF_ID =
      '2011817085-3jHPlME0';

    const SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbzo86xOy48YydkIGVeyd1t2L1dUdSqoERGoKBZvPLfspWA9dy6567ZHiG0Tjk2WTBph/exec';


    /* =========================================================
       STATE
    ========================================================= */

    let liffReady = false;
    let loadingStatus = false;

    let applicationList = [];


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const lineUser =
      document.getElementById('lineUser');

    const linePicture =
      document.getElementById('linePicture');

    const lineDisplayName =
      document.getElementById('lineDisplayName');

    const connectionStatus =
      document.getElementById('connectionStatus');

    const refreshButton =
      document.getElementById('refreshButton');

    const message =
      document.getElementById('message');

    const applications =
      document.getElementById('applications');

    const detailOverlay =
      document.getElementById('detailOverlay');

    const closeDetailButton =
      document.getElementById('closeDetailButton');

    const detailTitle =
      document.getElementById('detailTitle');

    const detailApplicationId =
      document.getElementById('detailApplicationId');

    const detailApplication =
      document.getElementById('detailApplication');

    const detailResume =
      document.getElementById('detailResume');


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showMessage(
      text,
      type
    ){

      message.textContent =
        text || '';

      message.className =
        text
          ? 'message show ' + (type || 'info')
          : 'message';
    }


    /* =========================================================
       LOADING
    ========================================================= */

    function showLoading(){

      applications.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <span>
            กำลังตรวจสอบสถานะ...
          </span>
        </div>
      `;
    }


    /* =========================================================
       REQUEST ID
    ========================================================= */

    function createRequestId(){

      return (
        Date.now().toString(36) +
        '_' +
        Math.random().toString(36).slice(2) +
        '_' +
        Math.random().toString(36).slice(2)
      );
    }


    /* =========================================================
       TOKEN
    ========================================================= */

    function getTokenExpiry(
      token
    ){

      try{

        const part =
          token.split('.')[1];

        const base64 =
          part
            .replace(/-/g, '+')
            .replace(/_/g, '/');

        const json =
          decodeURIComponent(
            atob(base64)
              .split('')
              .map(function(c){

                return '%' +
                  (
                    '00' +
                    c
                      .charCodeAt(0)
                      .toString(16)
                  ).slice(-2);

              })
              .join('')
          );

        return JSON.parse(json).exp || 0;

      }catch(error){

        return 0;

      }
    }


    function getIdToken(){

      const token =
        liff.getIDToken();

      if(!token){

        throw new Error(
          'ไม่พบ LINE ID Token กรุณาเปิด LIFF จาก LINE ใหม่'
        );

      }


      const exp =
        getTokenExpiry(
          token
        );

      const now =
        Math.floor(
          Date.now() / 1000
        );


      if(
        exp &&
        exp <= now + 60
      ){

        throw new Error(
          'ID_TOKEN_EXPIRED'
        );

      }


      return token;
    }


    /* =========================================================
       HIDDEN FORM POST
    ========================================================= */

    function addHidden(
      form,
      name,
      value
    ){

      const input =
        document.createElement(
          'input'
        );

      input.type =
        'hidden';

      input.name =
        name;

      input.value =
        value == null
          ? ''
          : String(value);

      form.appendChild(
        input
      );
    }


    function postFormApi(
      action,
      data,
      idToken,
      timeoutMs
    ){

      timeoutMs =
        timeoutMs || 120000;


      return new Promise(
        function(resolve, reject){

          const requestId =
            createRequestId();


          const targetForm =
            document.createElement(
              'form'
            );


          targetForm.method =
            'POST';

          targetForm.action =
            SCRIPT_URL;

          targetForm.target =
            'atworkPostFrame';

          targetForm.style.display =
            'none';


          addHidden(
            targetForm,
            'action',
            action
          );

          addHidden(
            targetForm,
            'requestId',
            requestId
          );

          addHidden(
            targetForm,
            'idToken',
            idToken
          );

          addHidden(
            targetForm,
            'data',
            JSON.stringify(
              data || {}
            )
          );


          document.body.appendChild(
            targetForm
          );


          let finished = false;
          let attempts = 0;
          let scriptEl = null;


          function cleanup(){

            if(scriptEl){

              scriptEl.remove();

            }

            try{

              targetForm.remove();

            }catch(error){}
          }


          function finish(
            error,
            result
          ){

            if(finished){

              return;
            }

            finished = true;


            clearTimeout(
              timeout
            );


            cleanup();


            if(error){

              reject(error);

            }else{

              resolve(result);

            }

          }


          const timeout =
            setTimeout(
              function(){

                finish(
                  new Error(
                    'Server ตอบกลับช้าเกินไป กรุณาลองใหม่อีกครั้ง'
                  )
                );

              },
              timeoutMs
            );


          function poll(){

            if(finished){

              return;
            }


            attempts++;


            if(scriptEl){

              scriptEl.remove();

            }


            const callbackName =
              '__atworkStatusCallback_' +
              Date.now() +
              '_' +
              Math.floor(
                Math.random() *
                1000000
              );


            scriptEl =
              document.createElement(
                'script'
              );


            window[callbackName] =
              function(result){

                try{

                  delete window[
                    callbackName
                  ];

                }catch(error){}


                if(scriptEl){

                  scriptEl.remove();

                }


                if(
                  !result ||
                  result.pending
                ){

                  if(
                    attempts < 110
                  ){

                    setTimeout(
                      poll,
                      900
                    );

                  }else{

                    finish(
                      new Error(
                        'ไม่พบผลลัพธ์จาก Server'
                      )
                    );

                  }


                  return;
                }


                finish(
                  null,
                  result
                );

              };


            scriptEl.onerror =
              function(){

                try{

                  delete window[
                    callbackName
                  ];

                }catch(error){}


                if(scriptEl){

                  scriptEl.remove();

                }


                if(
                  attempts < 110
                ){

                  setTimeout(
                    poll,
                    900
                  );

                }else{

                  finish(
                    new Error(
                      'ไม่สามารถตรวจสอบผลลัพธ์จาก Server ได้'
                    )
                  );

                }

              };


            scriptEl.src =
              SCRIPT_URL +
              '?action=status' +
              '&requestId=' +
              encodeURIComponent(
                requestId
              ) +
              '&callback=' +
              encodeURIComponent(
                callbackName
              ) +
              '&_=' +
              Date.now();


            document.body.appendChild(
              scriptEl
            );

          }


          try{

            targetForm.submit();

            poll();

          }catch(error){

            finish(
              error
            );

          }

        }
      );
    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(
      value
    ){

      return String(
        value == null
          ? ''
          : value
      )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );
    }


    /* =========================================================
       MONEY
    ========================================================= */

    function formatMoney(
      value
    ){

      const number =
        Number(value || 0);

      if(!number){

        return '-';

      }


      return (
        new Intl.NumberFormat(
          'th-TH'
        ).format(number)
        + ' บาท'
      );
    }


    /* =========================================================
       RENDER APPLICATION LIST
    ========================================================= */

    function renderApplications(
      list
    ){

      applicationList =
        Array.isArray(list)
          ? list
          : [];


      if(
        applicationList.length === 0
      ){

        applications.innerHTML = `
          <div class="empty">
            ยังไม่พบใบสมัครที่ผูกกับบัญชี LINE นี้
            <br><br>
            หากเพิ่งสมัครงาน
            กรุณากดรีเฟรชอีกครั้ง
          </div>
        `;

        showMessage(
          'ยังไม่พบข้อมูลใบสมัคร',
          'info'
        );

        return;
      }


      const cards =
        [...applicationList]
          .reverse()
          .map(function(
            app,
            reversedIndex
          ){

            const originalIndex =
              applicationList.length -
              1 -
              reversedIndex;


            const position =
              app.position ||
              'ไม่ระบุตำแหน่ง';

            const applicationId =
              app.applicationId ||
              '-';

            const status =
              app.status ||
              'ไม่ระบุสถานะ';

            const appliedDate =
              app.appliedDate ||
              '-';

            const resumeStatus =
              app.resumeStatus ||
              'ไม่มีไฟล์แนบ';


            return `

              <article
                class="application-card"
              >

                <div
                  class="application-top"
                >

                  <div>

                    <h2
                      class="application-position"
                    >
                      ${escapeHtml(
                        position
                      )}
                    </h2>

                    <div
                      class="application-id"
                    >
                      ใบสมัคร:
                      ${escapeHtml(
                        applicationId
                      )}
                    </div>

                  </div>


                  <div
                    class="status-badge"
                  >
                    ${escapeHtml(
                      status
                    )}
                  </div>

                </div>


                <div
                  class="meta-grid"
                >

                  <div
                    class="meta-item"
                  >

                    <span
                      class="meta-label"
                    >
                      วันที่สมัคร
                    </span>

                    <span
                      class="meta-value"
                    >
                      ${escapeHtml(
                        appliedDate
                      )}
                    </span>

                  </div>


                  <div
                    class="meta-item"
                  >

                    <span
                      class="meta-label"
                    >
                      Resume
                    </span>

                    <span
                      class="meta-value"
                    >
                      ${escapeHtml(
                        resumeStatus
                      )}
                    </span>

                  </div>

                </div>


                <button
                  type="button"
                  class="detail-button"
                  data-index="${originalIndex}"
                >
                  ดูรายละเอียด
                </button>

              </article>

            `;

          })
          .join('');


      applications.innerHTML =
        cards;


      showMessage(
        'โหลดสถานะการสมัครเรียบร้อยแล้ว',
        'success'
      );
    }


    /* =========================================================
       SHOW DETAIL
    ========================================================= */

    function showApplicationDetail(
      index
    ){

      const app =
        applicationList[index];


      if(!app){

        return;
      }


      detailTitle.textContent =
        app.position ||
        'รายละเอียดใบสมัคร';


      detailApplicationId.textContent =
        'ใบสมัคร: ' +
        (
          app.applicationId ||
          '-'
        );


      detailApplication.innerHTML = `

        <div class="detail-item">

          <span class="detail-label">
            ชื่อ-นามสกุล
          </span>

          <span class="detail-value">
            ${escapeHtml(
              app.name || '-'
            )}
          </span>

        </div>


        <div class="detail-item">

          <span class="detail-label">
            ตำแหน่ง
          </span>

          <span class="detail-value">
            ${escapeHtml(
              app.position || '-'
            )}
          </span>

        </div>


        <div class="detail-item">

          <span class="detail-label">
            เงินเดือนที่คาดหวัง
          </span>

          <span class="detail-value">
            ${escapeHtml(
              formatMoney(
                app.expectedSalary
              )
            )}
          </span>

        </div>


        <div class="detail-item">

          <span class="detail-label">
            วันที่พร้อมเริ่มงาน
          </span>

          <span class="detail-value">
            ${escapeHtml(
              app.startDate || '-'
            )}
          </span>

        </div>


        <div class="detail-item">

          <span class="detail-label">
            เบอร์โทรศัพท์
          </span>

          <span class="detail-value">
            ${escapeHtml(
              app.phone || '-'
            )}
          </span>

        </div>


        <div class="detail-item">

          <span class="detail-label">
            Email
          </span>

          <span class="detail-value">
            ${escapeHtml(
              app.email || '-'
            )}
          </span>

        </div>


        <div class="detail-item full">

          <span class="detail-label">
            ที่อยู่ปัจจุบัน
          </span>

          <span class="detail-value">
            ${escapeHtml(
              app.address || '-'
            )}
          </span>

        </div>


        <div class="detail-item">

          <span class="detail-label">
            วันที่สมัคร
          </span>

          <span class="detail-value">
            ${escapeHtml(
              app.appliedDate || '-'
            )}
          </span>

        </div>


        <div class="detail-item">

          <span class="detail-label">
            อัปเดตล่าสุด
          </span>

          <span class="detail-value">
            ${escapeHtml(
              app.updatedAt || '-'
            )}
          </span>

        </div>


        <div class="detail-item full">

          <span class="detail-label">
            สถานะใบสมัคร
          </span>

          <div
            style="margin-top:6px"
          >

            <span class="detail-status">
              ${escapeHtml(
                app.status ||
                'ไม่ระบุสถานะ'
              )}
            </span>

          </div>

        </div>

      `;


      /* =========================
         RESUME
      ========================= */

      const resumeName =
        app.resumeName ||
        '';

      const resumeStatus =
        app.resumeStatus ||
        'ไม่มีไฟล์แนบ';

      const resumeUrl =
        app.resumeUrl ||
        '';


      if(
        resumeName ||
        resumeUrl ||
        (
          resumeStatus !==
          'ไม่มีไฟล์แนบ'
        )
      ){

        detailResume.innerHTML = `

          <div class="resume-card">

            <div class="resume-name">
              ${escapeHtml(
                resumeName ||
                'มี Resume แนบอยู่'
              )}
            </div>

            <div class="resume-status">
              ${escapeHtml(
                resumeStatus
              )}
            </div>

            ${
              resumeUrl
                ? `
                  <a
                    class="resume-open"
                    href="${escapeHtml(
                      resumeUrl
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    เปิด Resume
                  </a>
                `
                : ''
            }

          </div>

        `;

      }else{

        detailResume.innerHTML = `

          <div class="no-resume">
            ใบสมัครนี้ไม่มี Resume แนบไว้
          </div>

        `;

      }


      detailOverlay.classList.add(
        'show'
      );

      document.body.style.overflow =
        'hidden';
    }


    /* =========================================================
       CLOSE DETAIL
    ========================================================= */

    function closeApplicationDetail(){

      detailOverlay.classList.remove(
        'show'
      );

      document.body.style.overflow =
        '';
    }


    /* =========================================================
       DETAIL CLICK
    ========================================================= */

    applications.addEventListener(
      'click',
      function(event){

        const button =
          event.target.closest(
            '.detail-button'
          );


        if(!button){

          return;
        }


        const index =
          Number(
            button.dataset.index
          );


        showApplicationDetail(
          index
        );

      }
    );


    closeDetailButton.addEventListener(
      'click',
      closeApplicationDetail
    );


    detailOverlay.addEventListener(
      'click',
      function(event){

        if(
          event.target ===
          detailOverlay
        ){

          closeApplicationDetail();

        }

      }
    );


    document.addEventListener(
      'keydown',
      function(event){

        if(
          event.key === 'Escape' &&
          detailOverlay.classList.contains(
            'show'
          )
        ){

          closeApplicationDetail();

        }

      }
    );


    /* =========================================================
       LOAD STATUS
    ========================================================= */

    async function loadStatus(){

      if(
        !liffReady ||
        loadingStatus
      ){

        return;
      }


      loadingStatus =
        true;


      refreshButton.disabled =
        true;

      refreshButton.textContent =
        'กำลังตรวจสอบ...';


      showLoading();

      showMessage(
        '',
        'info'
      );


      try{

        const idToken =
          getIdToken();


        const result =
          await postFormApi(
            'getMyApplications',
            {},
            idToken,
            120000
          );


        if(
          !result ||
          !result.ok
        ){

          throw new Error(
            result &&
            result.message
              ? result.message
              : 'ไม่สามารถตรวจสอบสถานะได้'
          );

        }


        renderApplications(
          result.applications || []
        );


      }catch(error){

        console.error(
          error
        );


        applications.innerHTML = `
          <div class="empty">
            ไม่สามารถโหลดข้อมูลสถานะได้
          </div>
        `;


        showMessage(
          error.message ||
          'ไม่สามารถตรวจสอบสถานะได้ กรุณาลองใหม่',
          'error'
        );


      }finally{

        loadingStatus =
          false;


        refreshButton.disabled =
          !liffReady;

        refreshButton.textContent =
          '🔄 รีเฟรชสถานะ';

      }

    }


    refreshButton.addEventListener(
      'click',
      loadStatus
    );


    /* =========================================================
       LIFF INIT
    ========================================================= */

    async function initLIFF(){

      try{

        await liff.init({

          liffId:
            LIFF_ID,

          withLoginOnExternalBrowser:
            true

        });


        if(
          !liff.isLoggedIn()
        ){

          if(
            !liff.isInClient()
          ){

            liff.login({

              redirectUri:
                window.location.href

            });

            return;
          }


          throw new Error(
            'ยังไม่ได้เข้าสู่ระบบ LINE'
          );

        }


        /* =====================
           LINE PROFILE
        ===================== */

        try{

          const profile =
            await liff.getProfile();


          lineUser.classList.remove(
            'hidden'
          );


          lineDisplayName.textContent =
            profile.displayName ||
            'ผู้ใช้ LINE';


          if(
            profile.pictureUrl
          ){

            linePicture.src =
              profile.pictureUrl;

          }

        }catch(error){

          console.warn(
            'ไม่สามารถโหลด LINE Profile',
            error
          );

        }


        /* =====================
           READY
        ===================== */

        connectionStatus.textContent =
          liff.isInClient()
            ? 'เชื่อมต่อ LINE สำเร็จ'
            : 'เชื่อมต่อ LINE สำเร็จ (Browser)';


        refreshButton.disabled =
          false;


        refreshButton.textContent =
          '🔄 รีเฟรชสถานะ';


        liffReady =
          true;


        /* =====================
           AUTO LOAD
        ===================== */

        await loadStatus();


      }catch(error){

        console.error(
          error
        );


        connectionStatus.textContent =
          'เชื่อมต่อ LINE ไม่สำเร็จ';


        refreshButton.disabled =
          true;


        applications.innerHTML = `
          <div class="empty">
            ไม่สามารถเชื่อมต่อ LINE ได้
          </div>
        `;


        showMessage(
          error.message ||
          'ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาเปิดจาก LINE ใหม่',
          'error'
        );

      }

    }


    /* =========================================================
       START
    ========================================================= */

    initLIFF();

  </script>
