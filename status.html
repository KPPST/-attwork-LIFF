<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b3a">
  <title>ATWORK | ตรวจสอบสถานะการสมัคร</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{--navy:#071b3a;--blue:#1657b8;--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--border:#dbe2ea;--success:#138a58;--warning:#b7791f;--danger:#c53b4b;--shadow:0 8px 30px rgba(15,35,70,.08);--radius:16px}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#eef4ff 0,var(--bg) 260px);color:var(--text);font-family:Arial,Tahoma,sans-serif;line-height:1.5}
    button{font:inherit;cursor:pointer}
    .app{max-width:760px;margin:0 auto;padding:16px 14px 40px}
    .hero{border-radius:20px;color:#fff;padding:22px;background:linear-gradient(135deg,var(--navy),#153d83 55%,#6c4ce6);box-shadow:var(--shadow);margin-bottom:12px}
    .brand{font-size:13px;letter-spacing:.8px;opacity:.9;font-weight:700}
    h1{margin:6px 0 4px;font-size:26px}.hero p{margin:0;opacity:.92;font-size:14px}
    .line-state{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:13px;background:rgba(255,255,255,.12);padding:7px 10px;border-radius:999px}
    .card{background:var(--card);border:1px solid #e4eaf2;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
    .card h2{font-size:18px;margin:0 0 4px}.hint{color:var(--muted);font-size:13px;margin:0 0 15px}
    .refresh{width:100%;border:0;border-radius:11px;background:linear-gradient(135deg,var(--blue),#6c4ce6);color:#fff;padding:13px 16px;font-weight:800}
    .refresh:disabled{opacity:.55;cursor:wait}
    .message{padding:11px 12px;border-radius:10px;background:#f3f6fa;color:#52606f;font-size:13px;margin-top:12px;white-space:pre-line}
    .message.info{background:#eef4ff;color:var(--blue)}.message.success{background:#ebf9f2;color:var(--success)}.message.danger{background:#fff0f2;color:var(--danger)}
    .list{margin-top:14px;display:grid;gap:10px}
    .application-card{border:1px solid #e3eaf2;border-radius:14px;padding:14px;background:#fff}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .position{font-size:15px;font-weight:900;line-height:1.4}
    .application-id{color:var(--muted);font-size:11.5px;margin-top:4px;word-break:break-all}
    .pill{display:inline-block;white-space:nowrap;padding:6px 9px;border-radius:999px;background:#eef4ff;color:var(--blue);font-size:11px;font-weight:900}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .meta-item{background:#f7f9fc;border-radius:10px;padding:10px}
    .label{font-size:10px;color:var(--muted)}
    .value{font-size:12px;font-weight:800;margin-top:3px;word-break:break-word}
    .empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:14px}
    .footer{text-align:center;margin-top:13px;color:#98a2b3;font-size:10.5px;line-height:1.6}
    @media(max-width:600px){.app{padding:10px 9px 30px}.hero{padding:20px 17px 17px;border-radius:24px}.card{padding:15px}.meta{grid-template-columns:1fr}.top{gap:8px}.pill{font-size:10px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">ATWORK | CAREER SERVICE</div>
      <h1>ตรวจสอบสถานะการสมัคร</h1>
      <p>ตรวจสอบสถานะใบสมัครของคุณจากบัญชี LINE ที่เข้าสู่ระบบอยู่</p>
      <div id="lineState" class="line-state">กำลังเชื่อมต่อ LINE...</div>
    </header>

    <section class="card">
      <h2>สถานะของฉัน</h2>
      <p class="hint">ระบบจะแสดงเฉพาะใบสมัครที่เชื่อมกับบัญชี LINE นี้</p>
      <button id="refreshButton" class="refresh" type="button" disabled>กำลังเชื่อมต่อ LINE...</button>
      <div id="statusMessage" class="message info" style="display:none"></div>
      <div id="applicationsList" class="list"></div>
    </section>

    <div class="footer">
      ข้อมูลสถานะที่แสดงเป็นข้อมูลสรุปเท่านั้น หากต้องการข้อมูลเพิ่มเติม เจ้าหน้าที่ @attwork จะติดต่อกลับ
    </div>
  </main>

<script>
  const LIFF_ID = '2011817085-3jHPlME0';
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzo86xOy48YydkIGVeyd1t2L1dUdSqoERGoKBZvPLfspWA9dy6567ZHiG0Tjk2WTBph/exec';

  let liffReady = false;
  let applicationList = [];

  const lineState = document.getElementById('lineState');
  const refreshButton = document.getElementById('refreshButton');
  const statusMessage = document.getElementById('statusMessage');
  const applicationsList = document.getElementById('applicationsList');

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[ch]));
  }

  function showMessage(text, type='info') {
    statusMessage.textContent = text || '';
    statusMessage.className = 'message ' + type;
    statusMessage.style.display = 'block';
  }

  function hideMessage() {
    statusMessage.style.display = 'none';
  }

  function createRequestId() {
    return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2) + '_' + Math.random().toString(36).slice(2);
  }

  function addHidden(form, name, value) {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = name;
    input.value = value == null ? '' : String(value);
    form.appendChild(input);
  }

  function postFormApi(action, data, idToken, timeoutMs=120000) {
    return new Promise((resolve, reject) => {
      const requestId = createRequestId();
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = SCRIPT_URL;
      form.target = 'atworkStatusFrame';
      form.style.display = 'none';

      addHidden(form, 'action', action);
      addHidden(form, 'requestId', requestId);
      addHidden(form, 'idToken', idToken);
      addHidden(form, 'data', JSON.stringify(data || {}));

      document.body.appendChild(form);

      let finished = false;
      let attempts = 0;
      let script = null;
      let timer = null;

      function cleanup() {
        clearTimeout(timer);
        if (script) script.remove();
        try { form.remove(); } catch (e) {}
      }

      function finish(error, result) {
        if (finished) return;
        finished = true;
        cleanup();
        error ? reject(error) : resolve(result);
      }

      timer = setTimeout(() => {
        finish(new Error('Server ตอบกลับช้าเกินไป กรุณาลองใหม่อีกครั้ง'));
      }, timeoutMs);

      function poll() {
        if (finished) return;
        attempts++;
        if (script) script.remove();

        const callbackName = '__atworkStatus_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
        script = document.createElement('script');

        window[callbackName] = result => {
          try { delete window[callbackName]; } catch (e) {}
          if (script) script.remove();

          if (!result || result.pending) {
            if (attempts < 110) setTimeout(poll, 900);
            else finish(new Error('ไม่พบผลลัพธ์จาก Server'));
            return;
          }

          finish(null, result);
        };

        script.onerror = () => {
          try { delete window[callbackName]; } catch (e) {}
          if (attempts < 110) setTimeout(poll, 900);
          else finish(new Error('ไม่สามารถตรวจสอบผลลัพธ์จาก Server ได้'));
        };

        script.src = SCRIPT_URL +
          '?action=status' +
          '&requestId=' + encodeURIComponent(requestId) +
          '&callback=' + encodeURIComponent(callbackName) +
          '&_=' + Date.now();

        document.body.appendChild(script);
      }

      try {
        form.submit();
        poll();
      } catch (error) {
        finish(error);
      }
    });
  }

  function tokenPayload(token) {
    try {
      const part = token.split('.')[1];
      const base64 = part.replace(/-/g, '+').replace(/_/g, '/');
      const text = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      return JSON.parse(text);
    } catch (e) {
      return {};
    }
  }

  function getCurrentIdToken() {
    const token = liff.getIDToken();
    if (!token) throw new Error('ไม่พบ LINE ID Token');
    const payload = tokenPayload(token);
    const now = Math.floor(Date.now() / 1000);
    if (payload.exp && payload.exp <= now + 60) {
      throw new Error('ID_TOKEN_EXPIRED_CLIENT');
    }
    return token;
  }

  async function loadStatus() {
    if (!liffReady) return;

    refreshButton.disabled = true;
    refreshButton.textContent = 'กำลังตรวจสอบสถานะ...';
    hideMessage();
    applicationsList.innerHTML = '';

    try {
      const idToken = getCurrentIdToken();
      const response = await postFormApi('getMyApplications', {}, idToken);
      const result = response && response.result ? response.result : response;

      if (!result || result.ok !== true) {
        throw new Error(result?.message || 'ไม่สามารถตรวจสอบสถานะได้');
      }

      renderApplications(result.applications || []);
    } catch (error) {
      console.error(error);
      if (error.message === 'ID_TOKEN_EXPIRED_CLIENT') {
        showMessage('เซสชัน LINE หมดอายุแล้ว กรุณาปิดหน้านี้ แล้วเปิดจาก LINE ใหม่', 'danger');
      } else {
        showMessage(error.message || 'ไม่สามารถตรวจสอบสถานะได้', 'danger');
      }
    } finally {
      refreshButton.disabled = !liffReady;
      refreshButton.textContent = '🔎 เช็กสถานะของฉัน';
    }
  }

  function renderApplications(applications) {
    applicationList = Array.isArray(applications) ? applications : [];

    if (!applicationList.length) {
      showMessage('ยังไม่พบใบสมัครที่ผูกกับบัญชี LINE นี้', 'info');
      return;
    }

    applicationsList.innerHTML = applicationList.slice().reverse().map(app => `
      <article class="application-card">
        <div class="top">
          <div>
            <div class="position">${escapeHtml(app.position || 'ไม่ระบุตำแหน่ง')}</div>
            <div class="application-id">ใบสมัคร: ${escapeHtml(app.applicationId || '-')}</div>
          </div>
          <div class="pill">${escapeHtml(app.status || 'รอตรวจสอบ')}</div>
        </div>

        <div class="meta">
          <div class="meta-item">
            <div class="label">วันที่สมัคร</div>
            <div class="value">${escapeHtml(app.appliedDate || '-')}</div>
          </div>
          <div class="meta-item">
            <div class="label">สถานะ Resume</div>
            <div class="value">${escapeHtml(app.resumeStatus || 'ไม่มีไฟล์แนบ')}</div>
          </div>
        </div>
      </article>
    `).join('');
  }

  refreshButton.addEventListener('click', loadStatus);

  async function initLiff() {
    try {
      await liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      });

      if (!liff.isLoggedIn()) {
        if (!liff.isInClient()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }
        throw new Error('ยังไม่ได้เข้าสู่ระบบ LINE');
      }

      try {
        const profile = await liff.getProfile();
        lineState.textContent = '● เชื่อมต่อ LINE แล้ว' + (profile.displayName ? ' · ' + profile.displayName : '');
      } catch (e) {
        lineState.textContent = '● เชื่อมต่อ LINE แล้ว';
      }

      liffReady = true;
      refreshButton.disabled = false;
      refreshButton.textContent = '🔎 เช็กสถานะของฉัน';

      await loadStatus();
    } catch (error) {
      console.error(error);
      lineState.textContent = 'เชื่อมต่อ LINE ไม่สำเร็จ';
      refreshButton.disabled = true;
      showMessage('ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาเปิดหน้านี้จาก LINE ใหม่', 'danger');
    }
  }

  initLiff();
</script>

<iframe id="atworkStatusFrame" name="atworkStatusFrame" style="display:none" title="ATWORK background request"></iframe>
</body>
</html>
