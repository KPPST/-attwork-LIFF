<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b3a">

  <title>ATWORK | ตรวจสอบสถานะการสมัคร</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{
      --navy:#071b3a;
      --blue:#1657b8;
      --purple:#6c4ce6;
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#182230;
      --muted:#667085;
      --border:#e3e8ef;
      --success:#138a58;
      --warning:#b7791f;
      --danger:#c53b4b;
      --shadow:0 10px 35px rgba(15,35,70,.10);
      --radius:22px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:
        linear-gradient(
          180deg,
          #edf4ff 0,
          #f4f7fb 260px
        );
      color:var(--text);
      font-family:Arial,Tahoma,sans-serif;
      line-height:1.5;
    }

    button{
      font:inherit;
      cursor:pointer;
    }

    .app{
      max-width:760px;
      margin:0 auto;
      padding:14px 12px 35px;
    }

    /* ==============================
       HERO
       ============================== */

    .hero{
      position:relative;
      overflow:hidden;
      border-radius:26px;
      color:#fff;
      padding:22px 20px 20px;
      background:
        linear-gradient(
          135deg,
          var(--navy),
          #153d83 55%,
          var(--purple)
        );
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }

    .hero::after{
      content:"";
      position:absolute;
      width:180px;
      height:180px;
      right:-70px;
      top:-70px;
      background:rgba(255,255,255,.08);
      border-radius:50%;
    }

    .brand{
      position:relative;
      z-index:1;
      font-size:12px;
      letter-spacing:.9px;
      opacity:.9;
      font-weight:700;
    }

    h1{
      position:relative;
      z-index:1;
      margin:7px 0 4px;
      font-size:25px;
    }

    .hero p{
      position:relative;
      z-index:1;
      margin:0;
      opacity:.9;
      font-size:13px;
    }

    .line-state{
      position:relative;
      z-index:1;
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-top:14px;
      font-size:12px;
      background:rgba(255,255,255,.12);
      padding:7px 11px;
      border-radius:999px;
    }

    /* ==============================
       CONTROL CARD
       ============================== */

    .control-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:15px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }

    .control-title{
      font-size:17px;
      font-weight:900;
      margin-bottom:3px;
    }

    .control-hint{
      color:var(--muted);
      font-size:12px;
      margin-bottom:12px;
    }

    .refresh{
      width:100%;
      border:0;
      border-radius:13px;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );
      color:#fff;
      padding:13px 16px;
      font-weight:800;
      box-shadow:0 6px 18px rgba(22,87,184,.18);
    }

    .refresh:disabled{
      opacity:.55;
      cursor:wait;
      box-shadow:none;
    }

    /* ==============================
       MESSAGE
       ============================== */

    .message{
      padding:11px 12px;
      border-radius:12px;
      font-size:13px;
      margin-top:12px;
      white-space:pre-line;
    }

    .message.info{
      background:#eef4ff;
      color:var(--blue);
    }

    .message.success{
      background:#ebf9f2;
      color:var(--success);
    }

    .message.danger{
      background:#fff0f2;
      color:var(--danger);
    }

    /* ==============================
       APPLICATION VISUAL CARDS
       ============================== */

    .applications-list{
      margin-top:14px;
      display:grid;
      gap:14px;
    }

    .application-card{
      position:relative;
      overflow:hidden;
      border-radius:22px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
    }

    .application-card::before{
      content:"";
      display:block;
      height:7px;
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--purple)
        );
    }

    .visual{
      padding:18px 16px 16px;
      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(108,76,230,.12),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #ffffff,
          #f8faff
        );
    }

    .visual-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }

    .job-icon{
      width:68px;
      height:68px;
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:34px;
      background:#eef4ff;
      flex:none;
    }

    .job-info{
      flex:1;
      min-width:0;
      padding-top:2px;
    }

    .job-label{
      font-size:10px;
      color:var(--muted);
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    .job-title{
      margin-top:3px;
      font-size:20px;
      font-weight:900;
      line-height:1.35;
      word-break:break-word;
    }

    .date{
      margin-top:4px;
      color:var(--muted);
      font-size:11px;
    }

    /* ==============================
       STATUS
       ============================== */

    .main-status{
      margin-top:16px;
      border-radius:18px;
      padding:15px;
      text-align:center;
      background:#f7f9fc;
      border:1px solid #edf0f4;
    }

    .status-caption{
      font-size:10px;
      color:var(--muted);
      font-weight:700;
      letter-spacing:.4px;
    }

    .status-value{
      margin-top:4px;
      font-size:18px;
      font-weight:900;
    }

    .status-sub{
      margin-top:3px;
      font-size:11px;
      color:var(--muted);
    }

    .status-waiting .status-value{
      color:var(--warning);
    }

    .status-success .status-value{
      color:var(--success);
    }

    .status-danger .status-value{
      color:var(--danger);
    }

    /* ==============================
       RESUME STATUS
       ============================== */

    .resume-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:12px;
      padding-top:12px;
      border-top:1px dashed #dfe5ec;
    }

    .resume-label{
      font-size:12px;
      color:var(--muted);
    }

    .resume-badge{
      border-radius:999px;
      padding:6px 10px;
      font-size:11px;
      font-weight:900;
      background:#eef4ff;
      color:var(--blue);
      white-space:nowrap;
    }

    .resume-ok{
      background:#ebf9f2;
      color:var(--success);
    }

    /* ==============================
       EMPTY
       ============================== */

    .empty{
      text-align:center;
      padding:38px 15px;
      color:var(--muted);
    }

    .empty-icon{
      font-size:46px;
      margin-bottom:9px;
    }

    .empty-title{
      font-size:16px;
      font-weight:900;
      color:var(--text);
    }

    .empty-text{
      margin-top:5px;
      font-size:12px;
      line-height:1.6;
    }

    /* ==============================
       FOOTER
       ============================== */

    .footer{
      text-align:center;
      margin-top:14px;
      color:#98a2b3;
      font-size:10px;
      line-height:1.6;
    }

    @media(max-width:600px){
      .app{
        padding:10px 9px 28px;
      }

      .hero{
        padding:20px 17px 17px;
        border-radius:24px;
      }

      h1{
        font-size:23px;
      }

      .job-title{
        font-size:18px;
      }

      .job-icon{
        width:60px;
        height:60px;
        font-size:30px;
        border-radius:18px;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <!-- HERO -->
  <header class="hero">

    <div class="brand">
      ATWORK | CAREER SERVICE
    </div>

    <h1>
      ตรวจสอบสถานะการสมัคร
    </h1>

    <p>
      ดูภาพรวมการสมัครของคุณจากบัญชี LINE
    </p>

    <div id="lineState" class="line-state">
      กำลังเชื่อมต่อ LINE...
    </div>

  </header>


  <!-- CONTROL -->
  <section class="control-card">

    <div class="control-title">
      การสมัครของฉัน
    </div>

    <div class="control-hint">
      แสดงเฉพาะภาพรวมของการสมัครและสถานะเท่านั้น
    </div>

    <button
      id="refreshButton"
      class="refresh"
      type="button"
      disabled
    >
      กำลังเชื่อมต่อ LINE...
    </button>

    <div
      id="statusMessage"
      class="message info"
      style="display:none"
    ></div>

  </section>


  <!-- APPLICATIONS -->
  <section
    id="applicationsList"
    class="applications-list"
  ></section>


  <!-- FOOTER -->
  <div class="footer">
    ข้อมูลที่แสดงเป็นข้อมูลสรุปสถานะการสมัครเท่านั้น
    เจ้าหน้าที่ ATWORK จะติดต่อกลับเมื่อมีความคืบหน้า
  </div>

</main>


<script>

  const LIFF_ID =
    '2011817085-3jHPlME0';

  const SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbzo86xOy48YydkIGVeyd1t2L1dUdSqoERGoKBZvPLfspWA9dy6567ZHiG0Tjk2WTBph/exec';


  let liffReady = false;


  const lineState =
    document.getElementById('lineState');

  const refreshButton =
    document.getElementById('refreshButton');

  const statusMessage =
    document.getElementById('statusMessage');

  const applicationsList =
    document.getElementById('applicationsList');


  /* =================================================
     HTML ESCAPE
     ================================================= */

  function escapeHtml(value){

    return String(value ?? '')
      .replace(/[&<>"']/g, ch => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[ch]));

  }


  /* =================================================
     MESSAGE
     ================================================= */

  function showMessage(
    text,
    type = 'info'
  ){

    statusMessage.textContent =
      text || '';

    statusMessage.className =
      'message ' + type;

    statusMessage.style.display =
      'block';

  }


  function hideMessage(){

    statusMessage.style.display =
      'none';

  }


  /* =================================================
     REQUEST ID
     ================================================= */

  function createRequestId(){

    return (
      Date.now().toString(36) +
      '_' +
      Math.random().toString(36).slice(2) +
      '_' +
      Math.random().toString(36).slice(2)
    );

  }


  /* =================================================
     FORM HELPER
     ================================================= */

  function addHidden(
    form,
    name,
    value
  ){

    const input =
      document.createElement('input');

    input.type = 'hidden';
    input.name = name;
    input.value =
      value == null ? '' : String(value);

    form.appendChild(input);

  }


  /* =================================================
     POST API
     ================================================= */

  function postFormApi(
    action,
    data,
    idToken,
    timeoutMs = 120000
  ){

    return new Promise((resolve,reject)=>{

      const requestId =
        createRequestId();

      const form =
        document.createElement('form');

      form.method = 'POST';
      form.action = SCRIPT_URL;
      form.target = 'atworkStatusFrame';
      form.style.display = 'none';


      addHidden(
        form,
        'action',
        action
      );

      addHidden(
        form,
        'requestId',
        requestId
      );

      addHidden(
        form,
        'idToken',
        idToken
      );

      addHidden(
        form,
        'data',
        JSON.stringify(data || {})
      );


      document.body.appendChild(form);


      let finished = false;
      let attempts = 0;
      let script = null;
      let timer = null;


      function cleanup(){

        clearTimeout(timer);

        if(script){
          script.remove();
        }

        try{
          form.remove();
        }catch(e){}

      }


      function finish(
        error,
        result
      ){

        if(finished) return;

        finished = true;

        cleanup();

        if(error){
          reject(error);
        }else{
          resolve(result);
        }

      }


      timer = setTimeout(()=>{

        finish(
          new Error(
            'Server ตอบกลับช้าเกินไป กรุณาลองใหม่อีกครั้ง'
          )
        );

      },timeoutMs);


      function poll(){

        if(finished) return;

        attempts++;


        if(script){
          script.remove();
        }


        const callbackName =
          '__atworkStatus_' +
          Date.now() +
          '_' +
          Math.floor(
            Math.random() * 1000000
          );


        script =
          document.createElement('script');


        window[callbackName] =
          result => {

            try{
              delete window[callbackName];
            }catch(e){}


            if(script){
              script.remove();
            }


            if(
              !result ||
              result.pending
            ){

              if(attempts < 110){

                setTimeout(
                  poll,
                  900
                );

              }else{

                finish(
                  new Error(
                    'ไม่พบผลลัพธ์จาก Server'
                  )
                );

              }

              return;

            }


            finish(
              null,
              result
            );

          };


        script.onerror = ()=>{

          try{
            delete window[callbackName];
          }catch(e){}


          if(
            attempts < 110
          ){

            setTimeout(
              poll,
              900
            );

          }else{

            finish(
              new Error(
                'ไม่สามารถตรวจสอบผลลัพธ์จาก Server ได้'
              )
            );

          }

        };


        script.src =
          SCRIPT_URL +
          '?action=status' +
          '&requestId=' +
          encodeURIComponent(
            requestId
          ) +
          '&callback=' +
          encodeURIComponent(
            callbackName
          ) +
          '&_=' +
          Date.now();


        document.body.appendChild(
          script
        );

      }


      try{

        form.submit();

        poll();

      }catch(error){

        finish(error);

      }

    });

  }


  /* =================================================
     TOKEN
     ================================================= */

  function tokenPayload(token){

    try{

      const part =
        token.split('.')[1];

      const base64 =
        part
          .replace(/-/g,'+')
          .replace(/_/g,'/');


      const text =
        decodeURIComponent(
          atob(base64)
            .split('')
            .map(
              c =>
                '%' +
                (
                  '00' +
                  c.charCodeAt(0)
                    .toString(16)
                ).slice(-2)
            )
            .join('')
        );


      return JSON.parse(text);

    }catch(e){

      return {};

    }

  }


  function getCurrentIdToken(){

    const token =
      liff.getIDToken();

    if(!token){

      throw new Error(
        'ไม่พบ LINE ID Token'
      );

    }


    const payload =
      tokenPayload(token);

    const now =
      Math.floor(
        Date.now() / 1000
      );


    if(
      payload.exp &&
      payload.exp <= now + 60
    ){

      throw new Error(
        'ID_TOKEN_EXPIRED_CLIENT'
      );

    }


    return token;

  }


  /* =================================================
     POSITION ICON
     ================================================= */

  function getPositionIcon(
    position
  ){

    const text =
      String(position || '')
        .toLowerCase();


    if(
      text.includes('ช่าง')
    ){
      return '🔧';
    }


    if(
      text.includes('โรงงาน')
    ){
      return '🏭';
    }


    if(
      text.includes('ออฟฟิศ') ||
      text.includes('office')
    ){
      return '💼';
    }


    return '📄';

  }


  /* =================================================
     STATUS CLASS
     ================================================= */

  function getStatusClass(
    status
  ){

    const text =
      String(status || '')
        .trim()
        .toLowerCase();


    if(
      text.includes('ผ่าน') ||
      text.includes('สำเร็จ') ||
      text.includes('อนุมัติ')
    ){

      return 'status-success';

    }


    if(
      text.includes('ไม่ผ่าน') ||
      text.includes('ยกเลิก') ||
      text.includes('ปฏิเสธ')
    ){

      return 'status-danger';

    }


    return 'status-waiting';

  }


  /* =================================================
     RESUME CLASS
     ================================================= */

  function getResumeClass(
    resumeStatus
  ){

    const text =
      String(resumeStatus || '')
        .trim()
        .toLowerCase();


    if(
      text.includes('แนบแล้ว') ||
      text.includes('สำเร็จ') ||
      text.includes('complete')
    ){

      return 'resume-badge resume-ok';

    }


    return 'resume-badge';

  }


  /* =================================================
     LOAD STATUS
     ================================================= */

  async function loadStatus(){

    if(!liffReady) return;


    refreshButton.disabled =
      true;

    refreshButton.textContent =
      'กำลังตรวจสอบสถานะ...';


    hideMessage();

    applicationsList.innerHTML =
      '';


    try{

      const idToken =
        getCurrentIdToken();


      const response =
        await postFormApi(
          'getMyApplications',
          {},
          idToken
        );


      const result =
        response && response.result
          ? response.result
          : response;


      if(
        !result ||
        result.ok !== true
      ){

        throw new Error(
          result?.message ||
          'ไม่สามารถตรวจสอบสถานะได้'
        );

      }


      renderApplications(
        result.applications || []
      );


    }catch(error){

      console.error(error);


      if(
        error.message ===
        'ID_TOKEN_EXPIRED_CLIENT'
      ){

        showMessage(
          'เซสชัน LINE หมดอายุแล้ว กรุณาปิดหน้านี้ แล้วเปิดจาก LINE ใหม่',
          'danger'
        );

      }else{

        showMessage(
          error.message ||
          'ไม่สามารถตรวจสอบสถานะได้',
          'danger'
        );

      }


    }finally{

      refreshButton.disabled =
        !liffReady;

      refreshButton.textContent =
        '🔎 เช็กสถานะของฉัน';

    }

  }


  /* =================================================
     RENDER
     ================================================= */

  function renderApplications(
    applications
  ){

    const list =
      Array.isArray(applications)
        ? applications
        : [];


    if(!list.length){

      applicationsList.innerHTML = `

        <div class="control-card">

          <div class="empty">

            <div class="empty-icon">
              📭
            </div>

            <div class="empty-title">
              ยังไม่พบใบสมัคร
            </div>

            <div class="empty-text">
              ยังไม่มีรายการสมัครงานที่เชื่อมกับบัญชี LINE นี้
            </div>

          </div>

        </div>

      `;

      return;

    }


    applicationsList.innerHTML =
      list
        .slice()
        .reverse()
        .map((app,index)=>{


          const position =
            app.position ||
            'ไม่ระบุตำแหน่ง';


          const status =
            app.status ||
            'รอตรวจสอบ';


          const resumeStatus =
            app.resumeStatus ||
            'ไม่มีไฟล์แนบ';


          const statusClass =
            getStatusClass(
              status
            );


          const resumeClass =
            getResumeClass(
              resumeStatus
            );


          const icon =
            getPositionIcon(
              position
            );


          return `

            <article
              class="
                application-card
                ${escapeHtml(statusClass)}
              "
            >

              <div class="visual">

                <div class="visual-top">

                  <div class="job-icon">
                    ${icon}
                  </div>

                  <div class="job-info">

                    <div class="job-label">
                      ใบสมัครครั้งที่ ${list.length - index}
                    </div>

                    <div class="job-title">
                      ${escapeHtml(position)}
                    </div>

                    <div class="date">
                      สมัครเมื่อ
                      ${escapeHtml(
                        app.appliedDate || '-'
                      )}
                    </div>

                  </div>

                </div>


                <div class="main-status">

                  <div class="status-caption">
                    สถานะการสมัคร
                  </div>

                  <div class="status-value">
                    ${escapeHtml(status)}
                  </div>

                  <div class="status-sub">
                    อัปเดตตามข้อมูลล่าสุดของระบบ
                  </div>

                </div>


                <div class="resume-row">

                  <div class="resume-label">
                    สถานะ Resume
                  </div>

                  <div class="${resumeClass}">
                    ${escapeHtml(resumeStatus)}
                  </div>

                </div>

              </div>

            </article>

          `;

        })
        .join('');

  }


  /* =================================================
     BUTTON
     ================================================= */

  refreshButton.addEventListener(
    'click',
    loadStatus
  );


  /* =================================================
     LIFF
     ================================================= */

  async function initLiff(){

    try{

      await liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      });


      if(!liff.isLoggedIn()){

        if(!liff.isInClient()){

          liff.login({
            redirectUri:
              window.location.href
          });

          return;

        }


        throw new Error(
          'ยังไม่ได้เข้าสู่ระบบ LINE'
        );

      }


      try{

        const profile =
          await liff.getProfile();


        lineState.textContent =
          '● เชื่อมต่อ LINE แล้ว' +
          (
            profile.displayName
              ? ' · ' +
                profile.displayName
              : ''
          );

      }catch(e){

        lineState.textContent =
          '● เชื่อมต่อ LINE แล้ว';

      }


      liffReady =
        true;


      refreshButton.disabled =
        false;

      refreshButton.textContent =
        '🔎 เช็กสถานะของฉัน';


      await loadStatus();


    }catch(error){

      console.error(error);


      lineState.textContent =
        'เชื่อมต่อ LINE ไม่สำเร็จ';


      refreshButton.disabled =
        true;


      showMessage(
        'ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาเปิดหน้านี้จาก LINE ใหม่',
        'danger'
      );

    }

  }


  initLiff();

</script>


<iframe
  id="atworkStatusFrame"
  name="atworkStatusFrame"
  style="display:none"
  title="ATWORK background request">
</iframe>

</body>
