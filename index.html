<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATWORK</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    #status {
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      background: #f1f3f5;
    }

    #profile {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    #profile img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>ATWORK</h1>

    <div id="status">
      กำลังเชื่อมต่อ LINE...
    </div>

    <div id="profile">
      <img id="profileImage" src="" alt="Profile">
      <h3 id="profileName"></h3>
      <p>เชื่อมต่อ LINE สำเร็จ</p>
    </div>

  </div>
</div>

<script>
  const LIFF_ID = "2011817085-Mqy2mWhy";

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzo86xOy48YydkIGVeyd1t2L1dUdSqoERGoKBZvPLfspWA9dy6567ZHiG0Tjk2WTBph/exec";

  // โค้ด LIFF เดิมของคุณอยู่ตรงนี้
  async function startLIFF() {
    // ...
  }

  // ✅ เอาข้อ 3 มาวางตรงนี้
  async function sendApplication() {
    try {
      const idToken = liff.getIDToken();

      if (!idToken) {
        throw new Error("ไม่พบ LINE ID Token");
      }

      const payload = {
        idToken: idToken,
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        jobType: document.getElementById("jobType").value,
        province: document.getElementById("province").value
      };

      const form = document.getElementById("applicationSubmitForm");

      form.action = APPS_SCRIPT_URL;

      document.getElementById("applicationPayload").value =
        JSON.stringify(payload);

      form.submit();

      alert("กำลังส่งใบสมัคร...");

    } catch (error) {
      console.error(error);
      alert("ส่งใบสมัครไม่สำเร็จ: " + error.message);
    }
  }

  startLIFF();
</script>

<iframe
  name="atworkBackend"
  id="atworkBackend"
  style="display:none;">
</iframe>

<form
  id="applicationSubmitForm"
  method="POST"
  target="atworkBackend"
  style="display:none;">

  <input type="hidden" name="action" value="application">
  <input type="hidden" name="payload" id="applicationPayload">

</form>

</body>
</html>
