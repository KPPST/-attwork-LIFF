<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ATWORK | สมัครงานและฝาก Resume</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .header {
      background: #173f73;
      color: white;
      padding: 26px 22px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      line-height: 1.6;
      color: #e4edfa;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 5px 20px #182b4610;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin: 14px 0 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #1769aa;
      color: white;
      width: 100%;
      margin-top: 20px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .notice {
      background: #eef5ff;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #24476d;
    }

    #message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      background: #e7f7ed;
      color: #17683a;
    }

    #message.error {
      display: block;
      background: #fff0f0;
      color: #a42626;
    }

    #message.loading {
      display: block;
      background: #eef5ff;
      color: #24476d;
    }

    .hidden {
      display: none;
    }

    .required {
      color: #c62828;
    }

    .profile {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #f8fafc;
      border-radius: 10px;
    }

    .profile-name {
      font-weight: 700;
    }

    .small {
      font-size: 12px;
      color: #64748b;
    }

    @media (max-width: 420px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <!-- HEADER -->
  <header class="header">
    <h1>ATWORK</h1>
    <p>
      ระบบสมัครงานและฝาก Resume<br>
      กรอกข้อมูลเพื่อให้เจ้าหน้าที่ตรวจสอบ
    </p>
  </header>


  <!-- MESSAGE -->
  <div
    id="message"
    role="status"
    aria-live="polite"
  ></div>


  <!-- SERVICE -->
  <section class="card">

    <h2>เลือกบริการ</h2>

    <label for="service">
      ต้องการใช้บริการใด
    </label>

    <select id="service">

      <option value="application">
        สมัครงาน
      </option>

      <option value="resume">
        ฝาก Resume
      </option>

    </select>

    <p
      class="notice"
      id="lineStatus"
    >
      กำลังเชื่อมต่อ LINE...
    </p>

    <div
      id="profileBox"
      class="profile"
    >
      <div>
        <div
          id="profileName"
          class="profile-name"
        ></div>

        <div class="small">
          เชื่อมต่อ LINE สำเร็จ
        </div>
      </div>
    </div>

  </section>


  <!-- ============================== -->
  <!-- APPLICATION -->
  <!-- ============================== -->

  <form
    id="applicationForm"
    class="card"
  >

    <h2>ข้อมูลสมัครงาน</h2>


    <label for="appName">
      ชื่อ-นามสกุล
      <span class="required">*</span>
    </label>

    <input
      id="appName"
      name="name"
      required
      maxlength="120"
    >


    <div class="grid">

      <div>

        <label for="appPhone">
          เบอร์โทรศัพท์
          <span class="required">*</span>
        </label>

        <input
          id="appPhone"
          name="phone"
          type="tel"
          required
          maxlength="20"
        >

      </div>


      <div>

        <label for="appEmail">
          อีเมล
        </label>

        <input
          id="appEmail"
          name="email"
          type="email"
          maxlength="150"
        >

      </div>

    </div>


    <label for="position">
      ตำแหน่งที่สมัคร
      <span class="required">*</span>
    </label>

    <select
      id="position"
      name="position"
      required
    >

      <option value="">
        เลือกตำแหน่ง
      </option>

      <option value="ช่าง">
        ช่าง
      </option>

      <option value="พนักงานโรงงาน">
        พนักงานโรงงาน
      </option>

      <option value="พนักงานออฟฟิศ">
        พนักงานออฟฟิศ
      </option>

      <option value="อื่น ๆ">
        อื่น ๆ
      </option>

    </select>


    <div class="grid">

      <div>

        <label for="salary">
          เงินเดือนที่คาดหวัง
        </label>

        <input
          id="salary"
          name="expectedSalary"
          type="number"
          min="0"
        >

      </div>


      <div>

        <label for="startDate">
          วันที่เริ่มงานได้
        </label>

        <input
          id="startDate"
          name="startDate"
          type="date"
        >

      </div>

    </div>


    <label for="houseNo">
      บ้านเลขที่
    </label>

    <input
      id="houseNo"
      name="houseNo"
      maxlength="50"
    >


    <div class="grid">

      <div>

        <label for="moo">
          หมู่
        </label>

        <input
          id="moo"
          name="moo"
          maxlength="20"
        >

      </div>


      <div>

        <label for="road">
          ถนน
        </label>

        <input
          id="road"
          name="road"
          maxlength="100"
        >

      </div>

    </div>


    <div class="grid">

      <div>

        <label for="subdistrict">
          ตำบล / แขวง
        </label>

        <input
          id="subdistrict"
          name="subdistrict"
          maxlength="100"
        >

      </div>


      <div>

        <label for="district">
          อำเภอ / เขต
        </label>

        <input
          id="district"
          name="district"
          maxlength="100"
        >

      </div>

    </div>


    <div class="grid">

      <div>

        <label for="appProvince">
          จังหวัด
        </label>

        <input
          id="appProvince"
          name="province"
          maxlength="100"
        >

      </div>


      <div>

        <label for="postalCode">
          รหัสไปรษณีย์
        </label>

        <input
          id="postalCode"
          name="postalCode"
          inputmode="numeric"
          maxlength="10"
        >

      </div>

    </div>


    <button
      class="primary"
      type="submit"
      id="applicationSubmitButton"
    >
      ส่งใบสมัคร
    </button>

  </form>


  <!-- ============================== -->
  <!-- RESUME -->
  <!-- ============================== -->

  <form
    id="resumeForm"
    class="card hidden"
  >

    <h2>ฝาก Resume</h2>


    <label for="resumeName">
      ชื่อ-นามสกุล
      <span class="required">*</span>
    </label>

    <input
      id="resumeName"
      name="name"
      required
      maxlength="120"
    >


    <label for="resumePhone">
      เบอร์โทรศัพท์
      <span class="required">*</span>
    </label>

    <input
      id="resumePhone"
      name="phone"
      type="tel"
      required
      maxlength="20"
    >


    <label for="jobType">
      ประเภทงานที่สนใจ
      <span class="required">*</span>
    </label>

    <select
      id="jobType"
      name="jobType"
      required
    >

      <option value="">
        เลือกประเภทงาน
      </option>

      <option value="ช่าง">
        ช่าง
      </option>

      <option value="พนักงานโรงงาน">
        พนักงานโรงงาน
      </option>

      <option value="พนักงานออฟฟิศ">
        พนักงานออฟฟิศ
      </option>

      <option value="อื่น ๆ">
        อื่น ๆ
      </option>

    </select>


    <label for="resumeProvince">
      จังหวัดที่ต้องการทำงาน
    </label>

    <input
      id="resumeProvince"
      name="province"
      maxlength="100"
    >


    <label for="resumeFile">
      ไฟล์ Resume
      <span class="required">*</span>
    </label>

    <input
      id="resumeFile"
      type="file"
      accept=".pdf,.jpg,.jpeg,.png"
      required
    >

    <p class="notice">
      รองรับ PDF, JPG และ PNG
      ขนาดไม่เกิน 5 MB
    </p>


    <button
      class="primary"
      type="submit"
      id="resumeSubmitButton"
    >
      ส่ง Resume
    </button>

  </form>


  <p class="notice">
    ข้อมูลที่ส่งจะมีสถานะเริ่มต้นเป็น
    “รอตรวจสอบ”
  </p>

</main>


<!-- ========================================= -->
<!-- HIDDEN BACKEND IFRAME -->
<!-- ========================================= -->

<iframe
  name="atworkBackend"
  id="atworkBackend"
  style="display:none;"
></iframe>


<form
  id="backendForm"
  method="POST"
  target="atworkBackend"
  style="display:none;"
>

  <input
    type="hidden"
    name="action"
    id="backendAction"
  >

  <input
    type="hidden"
    name="payload"
    id="backendPayload"
  >

</form>


<script>

  /* =========================================
     CONFIG
  ========================================= */

  const LIFF_ID =
    "2011817085-Mqy2mWhy";

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzo86xOy48YydkIGVeyd1t2L1dUdSqoERGoKBZvPLfspWA9dy6567ZHiG0Tjk2WTBph/exec";

  const MAX_FILE_SIZE =
    5 * 1024 * 1024;


  let liffReady = false;
  let idToken = "";
  let profile = null;


  const $ = id =>
    document.getElementById(id);


  const service =
    $("service");

  const appForm =
    $("applicationForm");

  const resumeForm =
    $("resumeForm");

  const message =
    $("message");


  /* =========================================
     MESSAGE
  ========================================= */

  function showMessage(text, type) {

    message.textContent =
      text;

    message.className =
      type;

    message.style.display =
      "block";

    message.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }


  /* =========================================
     FORM BUSY
  ========================================= */

  function setBusy(
    form,
    busy
  ) {

    const button =
      form.querySelector(
        'button[type="submit"]'
      );

    button.disabled =
      busy;

    button.textContent =
      busy
        ? "กำลังส่งข้อมูล..."
        : (
            form === appForm
              ? "ส่งใบสมัคร"
              : "ส่ง Resume"
          );
  }


  /* =========================================
     SERVICE SWITCH
  ========================================= */

  function updateService() {

    const isResume =
      service.value === "resume";

    appForm.classList.toggle(
      "hidden",
      isResume
    );

    resumeForm.classList.toggle(
      "hidden",
      !isResume
    );

    message.style.display =
      "none";
  }


  service.addEventListener(
    "change",
    updateService
  );

  updateService();


  /* =========================================
     LIFF
  ========================================= */

  async function initLIFF() {

    try {

      await liff.init({
        liffId: LIFF_ID
      });


      /*
       * ใน LIFF Browser:
       * ไม่เรียก liff.login() เอง
       *
       * External browser:
       * ถ้ายัง login ไม่แล้ว ให้ login
       */

      if (
        !liff.isInClient() &&
        !liff.isLoggedIn()
      ) {

        $("lineStatus").textContent =
          "กำลังเข้าสู่ระบบ LINE...";

        liff.login();

        return;
      }


      /*
       * ถ้าอยู่ใน LIFF Browser
       * ผู้ใช้ควร login อยู่แล้ว
       */

      if (!liff.isLoggedIn()) {

        $("lineStatus").textContent =
          "กรุณาเปิดหน้านี้ผ่าน LINE";

        return;
      }


      idToken =
        liff.getIDToken();


      if (!idToken) {

        throw new Error(
          "ไม่สามารถอ่าน LINE ID Token ได้"
        );
      }


      /*
       * profile
       */

      try {

        profile =
          await liff.getProfile();

        $("profileName").textContent =
          profile.displayName || "";

        $("profileBox")
          .style.display =
          "block";

        $("appName").value =
          profile.displayName || "";

        $("resumeName").value =
          profile.displayName || "";

      } catch (profileError) {

        console.warn(
          "Profile error:",
          profileError
        );

      }


      liffReady = true;

      $("lineStatus").textContent =
        "เชื่อมต่อ LINE สำเร็จ";


    } catch (error) {

      console.error(
        "LIFF ERROR:",
        error
      );

      $("lineStatus").textContent =
        "เชื่อมต่อ LINE ไม่สำเร็จ";

      showMessage(
        error.message ||
        "เกิดข้อผิดพลาดในการเชื่อมต่อ LINE",
        "error"
      );

    }

  }


  /* =========================================
     CREATE REQUEST ID
  ========================================= */

  function createRequestId() {

    return (
      "REQ_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2, 10)
    );
  }


  /* =========================================
     SEND TO APPS SCRIPT
  ========================================= */

  function sendToBackend(
    action,
    payload,
    form
  ) {

    return new Promise(
      function(resolve, reject) {

        if (
          !liffReady ||
          !idToken
        ) {

          reject(
            new Error(
              "LINE ยังเชื่อมต่อไม่สำเร็จ"
            )
          );

          return;
        }


        const requestId =
          createRequestId();


        payload.idToken =
          idToken;

        payload.requestId =
          requestId;


        setBusy(
          form,
          true
        );


        showMessage(
          action === "application"
            ? "กำลังส่งใบสมัคร..."
            : "กำลังส่ง Resume...",
          "loading"
        );


        /*
         * POST -> Apps Script
         */

        $("backendAction").value =
          action;

        $("backendPayload").value =
          JSON.stringify(payload);


        const backendForm =
          $("backendForm");

        backendForm.action =
          APPS_SCRIPT_URL;

        backendForm.submit();


        /*
         * ตรวจสอบผลแบบ JSONP
         */

        pollStatus(
          requestId,
          action,
          form,
          resolve,
          reject,
          0
        );

      }
    );
  }


  /* =========================================
     POLL STATUS
  ========================================= */

  function pollStatus(
    requestId,
    action,
    form,
    resolve,
    reject,
    attempt
  ) {

    /*
     * ประมาณ 20 วินาที
     */

    if (attempt >= 20) {

      setBusy(
        form,
        false
      );

      reject(
        new Error(
          "ระบบใช้เวลานานเกินไปในการยืนยันผล กรุณาตรวจสอบ Google Sheets"
        )
      );

      return;
    }


    const callbackName =
      "atworkCallback_" +
      Date.now() +
      "_" +
      attempt;


    window[callbackName] =
      function(data) {

        try {

          delete window[
            callbackName
          ];


          if (
            data &&
            data.pending
          ) {

            setTimeout(
              function() {

                pollStatus(
                  requestId,
                  action,
                  form,
                  resolve,
                  reject,
                  attempt + 1
                );

              },
              1000
            );

            return;
          }


          setBusy(
            form,
            false
          );


          if (
            data &&
            data.success
          ) {

            resolve(
              data.result || {}
            );

            return;
          }


          reject(
            new Error(
              data &&
              data.error
                ? data.error
                : "ไม่สามารถบันทึกข้อมูลได้"
            )
          );


        } catch (error) {

          reject(error);

        }

      };


    const script =
      document.createElement(
        "script"
      );


    script.src =
      APPS_SCRIPT_URL +
      "?action=status" +
      "&requestId=" +
      encodeURIComponent(
        requestId
      ) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      ) +
      "&t=" +
      Date.now();


    script.onerror =
      function() {

        delete window[
          callbackName
        ];

        setTimeout(
          function() {

            pollStatus(
              requestId,
              action,
              form,
              resolve,
              reject,
              attempt + 1
            );

          },
          1000
        );

      };


    document.body.appendChild(
      script
    );


    setTimeout(
      function() {

        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );
        }

      },
      3000
    );

  }


  /* =========================================
     APPLICATION
  ========================================= */

  appForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (!liffReady) {

        showMessage(
          "LINE ยังเชื่อมต่อไม่สำเร็จ",
          "error"
        );

        return;
      }


      const payload =
        Object.fromEntries(
          new FormData(
            appForm
          ).entries()
        );


      try {

        const result =
          await sendToBackend(
            "application",
            payload,
            appForm
          );


        showMessage(
          "ส่งใบสมัครเรียบร้อยแล้ว" +
          (
            result.applicationId
              ? " เลขที่ใบสมัคร: " +
                result.applicationId
              : ""
          ) +
          " สถานะ: " +
          (
            result.status ||
            "รอตรวจสอบ"
          ),
          "success"
        );


        appForm.reset();


        if (
          profile &&
          profile.displayName
        ) {

          $("appName").value =
            profile.displayName;
        }


      } catch (error) {

        console.error(
          "APPLICATION ERROR:",
          error
        );

        showMessage(
          error.message ||
          "ส่งใบสมัครไม่สำเร็จ",
          "error"
        );

      }

    }
  );


  /* =========================================
     RESUME
  ========================================= */

  resumeForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (!liffReady) {

        showMessage(
          "LINE ยังเชื่อมต่อไม่สำเร็จ",
          "error"
        );

        return;
      }


      const file =
        $("resumeFile").files[0];


      if (!file) {

        showMessage(
          "กรุณาเลือกไฟล์ Resume",
          "error"
        );

        return;
      }


      const allowedTypes = [
        "application/pdf",
        "image/jpeg",
        "image/png"
      ];


      if (
        !allowedTypes.includes(
          file.type
        )
      ) {

        showMessage(
          "รองรับเฉพาะ PDF, JPG และ PNG",
          "error"
        );

        return;
      }


      if (
        file.size >
        MAX_FILE_SIZE
      ) {

        showMessage(
          "ไฟล์ต้องมีขนาดไม่เกิน 5 MB",
          "error"
        );

        return;
      }


      try {

        setBusy(
          resumeForm,
          true
        );


        showMessage(
          "กำลังอ่านไฟล์ Resume...",
          "loading"
        );


        const dataUrl =
          await new Promise(
            function(resolve, reject) {

              const reader =
                new FileReader();


              reader.onload =
                function() {

                  resolve(
                    reader.result
                  );

                };


              reader.onerror =
                function() {

                  reject(
                    new Error(
                      "อ่านไฟล์ไม่สำเร็จ"
                    )
                  );

                };


              reader.readAsDataURL(
                file
              );

            }
          );


        const fileData =
          String(dataUrl)
            .split(",")[1];


        const payload = {

          name:
            $("resumeName")
              .value
              .trim(),

          phone:
            $("resumePhone")
              .value
              .trim(),

          jobType:
            $("jobType")
              .value,

          province:
            $("resumeProvince")
              .value
              .trim(),

          fileName:
            file.name,

          mimeType:
            file.type,

          fileData:
            fileData

        };


        if (
          !payload.name ||
          !payload.phone ||
          !payload.jobType
        ) {

          throw new Error(
            "กรุณากรอกชื่อ เบอร์โทร และประเภทงานที่สนใจ"
          );
        }


        const result =
          await sendToBackend(
            "resume",
            payload,
            resumeForm
          );


        showMessage(
          "ฝาก Resume เรียบร้อยแล้ว" +
          (
            result.candidateId
              ? " เลขที่ผู้สมัคร: " +
                result.candidateId
              : ""
          ) +
          " สถานะ: " +
          (
            result.status ||
            "รอตรวจสอบ"
          ),
          "success"
        );


        resumeForm.reset();


        if (
          profile &&
          profile.displayName
        ) {

          $("resumeName").value =
            profile.displayName;
        }


      } catch (error) {

        console.error(
          "RESUME ERROR:",
          error
        );

        setBusy(
          resumeForm,
          false
        );

        showMessage(
          error.message ||
          "ส่ง Resume ไม่สำเร็จ",
          "error"
        );

      }

    }
  );


  /* =========================================
     START
  ========================================= */

  initLIFF();

</script>

</body>
</html>
