<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATWORK</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    #status {
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      background: #f1f3f5;
    }

    #profile {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    #profile img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>ATWORK</h1>

    <div id="status">
      กำลังเชื่อมต่อ LINE...
    </div>

    <div id="profile">
      <img id="profileImage" src="" alt="Profile">
      <h3 id="profileName"></h3>
      <p>เชื่อมต่อ LINE สำเร็จ</p>
    </div>

  </div>
</div>

<script>

const LIFF_ID = "2011817085-Mqy2mWhy";

async function startLIFF() {
  try {

    await liff.init({
      liffId: LIFF_ID,
      withLoginOnExternalBrowser: true
    });

    console.log("LIFF initialized");
    console.log("isInClient:", liff.isInClient());
    console.log("isLoggedIn:", liff.isLoggedIn());

    if (!liff.isLoggedIn()) {

      document.getElementById("status").textContent =
        "กรุณาเข้าสู่ระบบ LINE...";

      liff.login();

      return;
    }

    const profile = await liff.getProfile();

    document.getElementById("status").textContent =
      "เชื่อมต่อ LINE สำเร็จ";

    document.getElementById("profile").style.display = "block";

    document.getElementById("profileImage").src =
      profile.pictureUrl || "";

    document.getElementById("profileName").textContent =
      profile.displayName || "ผู้ใช้ LINE";

  } catch (error) {

    console.error("LIFF ERROR:", error);

    document.getElementById("status").textContent =
      "เกิดข้อผิดพลาด: " + (error.message || error);

  }
}

startLIFF();

</script>

</body>
</html>
