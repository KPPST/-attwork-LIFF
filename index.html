<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ATWORK | สมัครงาน</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 20px 14px 40px;
    }

    .header {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .subtitle {
      margin-top: 5px;
      color: #6b7280;
      font-size: 14px;
    }

    .line-user {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .line-user img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 50%;
      background: #eee;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 13px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #d7dce5;
      border-radius: 10px;
      font-size: 15px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .required {
      color: #dc2626;
    }

    .hint {
      margin-top: 5px;
      color: #6b7280;
      font-size: 12px;
    }

    .submit-button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .submit-button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .status {
      margin-top: 12px;
      padding: 13px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.info {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status.success {
      background: #ecfdf5;
      color: #047857;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .hidden {
      display: none !important;
    }

    .connection {
      font-size: 13px;
      margin-top: 10px;
    }

    .file-box {
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 15px;
      background: #f8fafc;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="brand">
      ATWORK
    </div>

    <div class="subtitle">
      สมัครงานและฝาก Resume
    </div>

    <div
      id="lineUser"
      class="line-user hidden"
    >
      <img
        id="linePicture"
        src=""
        alt=""
      >

      <div>
        <div id="lineDisplayName"></div>

        <div
          id="connectionStatus"
          class="connection"
        >
          กำลังเชื่อมต่อ LINE...
        </div>
      </div>
    </div>

  </div>


  <!-- =========================================
       APPLICATION FORM
       ========================================= -->

  <form
    id="applicationForm"
    class="card"
  >

    <div class="section-title">
      สมัครงาน
    </div>


    <div class="grid">

      <div class="field full">
        <label>
          ชื่อ-นามสกุล
          <span class="required">*</span>
        </label>

        <input
          id="appName"
          name="name"
          required
        >
      </div>


      <div class="field">

        <label>
          เบอร์โทรศัพท์
          <span class="required">*</span>
        </label>

        <input
          id="appPhone"
          name="phone"
          type="tel"
          required
        >

      </div>


      <div class="field">

        <label>
          Email
        </label>

        <input
          id="appEmail"
          name="email"
          type="email"
        >

      </div>


      <div class="field">

        <label>
          ตำแหน่งที่สมัคร
          <span class="required">*</span>
        </label>

        <input
          id="position"
          name="position"
          required
        >

      </div>


      <div class="field">

        <label>
          เงินเดือนที่คาดหวัง
        </label>

        <input
          id="salary"

      <div class="field">

      <div class="field">

        <label>
          บ้านเลขที่

        <input
          id="houseNo"
          name="houseNo"
        >

      </div>


      <div class="field">

        <label>
          หมู่
        </label>

        <input
          id="moo"
          name="moo"
        >

      </div>


      <div class="field full">

        <label>
          ถนน
        </label>

        <input
          id="road"
          name="road"
        >

      </div>


      <div class="field">

        <label>
          ตำบล / แขวง
        </label>

        <input
          id="subdistrict"
          name="subdistrict"
        >

      </div>


      <div class="field">

        <label>
          อำเภอ / เขต
        </label>

        <input
          id="district"
          name="district"
        >

      </div>


      <div class="field">

        <label>
          จังหวัด
        </label>

        <input
          id="appProvince"
          name="province"
        >

      </div>


      <div class="field">

        <label>
          รหัสไปรษณีย์
        </label>

        <input
          id="postalCode"
          name="postalCode"
          inputmode="numeric"
        >

      </div>

    </div>


    <!-- =====================================
         RESUME
         ===================================== -->

    <div
      style="
        border-top:1px solid #e5e7eb;
        margin:20px 0;
        padding-top:20px;
      "
    >

      <div class="section-title">
        ฝาก Resume
      </div>


      <div class="field">

        <label>
          ประเภทงานที่สนใจ
          <span class="required">*</span>
        </label>

        <input
          id="jobType"
          name="jobType"
          placeholder="เช่น พนักงานออฟฟิศ / ช่าง / โรงงาน"
          required
        >

      </div>


      <div class="field">

        <label>
          จังหวัดที่ต้องการทำงาน
        </label>

        <input
          id="resumeProvince"
          name="resumeProvince"
        >

      </div>


      <div class="field">

        <label>
          Resume
          <span class="required">*</span>
        </label>

        <div class="file-box">

          <input
            id="resumeFile"
            type="file"
            accept=".jpg,.jpeg,.png,image/jpeg,image/png"
            required
          >

          <div class="hint">
            รองรับ JPG / JPEG / PNG ขนาดไม่เกิน 10 MB
          </div>

        </div>

      </div>

    </div>


    <button
      id="submitButton"
      class="submit-button"
      type="submit"
      disabled
    >
      เชื่อมต่อ LINE...
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </form>

</div>


<!-- Hidden iframe -->
<iframe
  id="postFrame"
  name="postFrame"
  style="display:none"
></iframe>


<script>

  /* =========================================
   * CONFIG
   * ========================================= */

  const LIFF_ID =
    '2011817085-Mqy2mWhy';

  const SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbzo86xOy48YydkIGVeyd1t2L1dUdSqoERGoKBZvPLfspWA9dy6567ZHiG0Tjk2WTBph/exec';


  let liffReady = false;
  let submitting = false;


  /* =========================================
   * DOM
   * ========================================= */

  const applicationForm =
    document.getElementById('applicationForm');

  const submitButton =
    document.getElementById('submitButton');

  const statusBox =
    document.getElementById('status');

  const lineUser =
    document.getElementById('lineUser');

  const linePicture =
    document.getElementById('linePicture');

  const lineDisplayName =
    document.getElementById('lineDisplayName');

  const connectionStatus =
    document.getElementById('connectionStatus');


  /* =========================================
   * STATUS
   * ========================================= */

  function showStatus(message, type) {

    statusBox.textContent = message;

    statusBox.className =
      'status show ' + type;
  }


  function clearStatus() {

    statusBox.textContent = '';

    statusBox.className = 'status';
  }


  /* =========================================
   * INIT LIFF
   * ========================================= */

  async function initLIFF() {

    try {

      await liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      });


      /*
       * In LIFF browser:
       * login happens automatically during init.
       *
       * In external browser:
       * withLoginOnExternalBrowser=true
       * automatically starts login.
       */

      if (!liff.isLoggedIn()) {

        if (!liff.isInClient()) {

          liff.login({
            redirectUri: window.location.href
          });

          return;
        }

        throw new Error(
          'ยังไม่ได้เข้าสู่ระบบ LINE'
        );
      }


      /*
       * Get profile only for UI.
       *
       * IMPORTANT:
       * We do NOT send this profile to server
       * for authentication.
       */

      let profile = null;

      try {
        profile = await liff.getProfile();
      } catch (profileError) {
        console.warn(
          'getProfile failed',
          profileError
        );
      }


      if (profile) {

        lineUser.classList.remove('hidden');

        lineDisplayName.textContent =
          profile.displayName || 'ผู้ใช้ LINE';

        if (profile.pictureUrl) {

          linePicture.src =
            profile.pictureUrl;
        }
      }


      connectionStatus.textContent =
        'เชื่อมต่อ LINE สำเร็จ';

      submitButton.disabled = false;

      submitButton.textContent =
        'ส่งใบสมัคร';

      liffReady = true;


    } catch (error) {

      console.error(error);

      connectionStatus.textContent =
        'เชื่อมต่อ LINE ไม่สำเร็จ';

      submitButton.disabled = true;

      submitButton.textContent =
        'ไม่สามารถส่งข้อมูลได้';

      showStatus(
        'ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาเปิด LIFF ใหม่อีกครั้ง',
        'error'
      );
    }
  }


  /* =========================================
   * JWT EXPIRY CHECK
   * ========================================= */

  function getTokenExpiry(idToken) {

    try {

      const parts =
        idToken.split('.');

      if (parts.length !== 3) {
        return 0;
      }

      const payload =
        parts[1]
          .replace(/-/g, '+')
          .replace(/_/g, '/');

      const json =
        decodeURIComponent(
          atob(payload)
            .split('')
            .map(function(c) {
              return '%' +
                ('00' + c.charCodeAt(0).toString(16))
                  .slice(-2);
            })
            .join('')
        );

      return JSON.parse(json).exp || 0;

    } catch (error) {

      return 0;
    }
  }


  /* =========================================
   * GET ID TOKEN
   * ========================================= */

  async function getCurrentIdToken() {

    if (!liffReady) {
      throw new Error(
        'LIFF ยังเชื่อมต่อไม่เสร็จ'
      );
    }


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        'ไม่พบ LINE ID Token'
      );
    }


    const exp =
      getTokenExpiry(idToken);

    const now =
      Math.floor(Date.now() / 1000);


    /*
     * เหลือน้อยกว่า 60 วินาที
     * ถือว่าใกล้หมดอายุแล้ว
     */
    if (exp && exp <= now + 60) {

      throw new Error(
        'ID_TOKEN_EXPIRED_CLIENT'
      );
    }


    return idToken;
  }


  /* =========================================
   * HANDLE EXPIRED TOKEN
   * ========================================= */

  function handleTokenExpired() {

    /*
     * ถ้าเปิดจาก external browser
     * สามารถ logout แล้ว login ใหม่ได้
     */
    if (!liff.isInClient()) {

      try {

        liff.logout();

      } catch (error) {

        console.warn(error);
      }


      liff.login({
        redirectUri: window.location.href
      });

      return;
    }


    /*
     * ถ้าเปิดใน LIFF browser
     * liff.login() ใช้ไม่ได้
     *
     * ลอง reload 1 ครั้งเพื่อให้ LIFF init
     * สร้าง authentication state ใหม่
     */
    const reloaded =
      sessionStorage.getItem(
        'ATWORK_TOKEN_RELOAD'
      );


    if (!reloaded) {

      sessionStorage.setItem(
        'ATWORK_TOKEN_RELOAD',
        '1'
      );

      location.reload();

      return;
    }


    sessionStorage.removeItem(
      'ATWORK_TOKEN_RELOAD'
    );


    showStatus(
      'เซสชัน LINE หมดอายุแล้ว กรุณาปิดหน้านี้ แล้วเปิดแบบฟอร์ม ATWORK จาก LINE ใหม่อีกครั้ง',
      'error'
    );
  }


  /* =========================================
   * CREATE REQUEST ID
   * ========================================= */

  function createRequestId() {

    return (
      Date.now().toString(36) +
      '_' +
      Math.random()
        .toString(36)
        .slice(2)
    );
  }


  /* =========================================
   * SUBMIT TO APPS SCRIPT
   * ========================================= */

  function postToAppsScript(
    action,
    payload,
    idToken
  ) {

    return new Promise(function(
      resolve,
      reject
    ) {

      const requestId =
        createRequestId();


      const iframe =
        document.getElementById('postFrame');


      iframe.name = 'postFrame';


      const form =
        document.createElement('form');


      form.method = 'POST';

      form.action = SCRIPT_URL;

      form.target = 'postFrame';

      form.style.display = 'none';


      addHidden(
        form,
        'action',
        action
      );

      addHidden(
        form,
        'requestId',
        requestId
      );

      addHidden(
        form,
        'idToken',
        idToken
      );

      addHidden(
        form,
        'payload',
        JSON.stringify(payload)
      );


      document.body.appendChild(form);


      let finished = false;

      const timeout =
        setTimeout(function() {

          if (!finished) {

            finished = true;

            cleanup();

            reject(
              new Error(
                'การเชื่อมต่อ Server หมดเวลา'
              )
            );
          }

        }, 45000);


      form.submit();


      /*
       * ไม่ใช้ response จาก POST
       *
       * Poll ด้วย JSONP แทน
       * เพื่อหลีกเลี่ยง CORS
       */

      let pollCount = 0;


      function poll() {

        if (finished) {
          return;
        }


        pollCount++;


        const callbackName =
          '__atwork_' +
          Date.now() +
          '_' +
          Math.floor(
            Math.random() * 10000
          );


        window[callbackName] =
          function(result) {

            cleanupJsonp(
              callbackName,
              script
            );


            if (!result || result.pending) {

              if (pollCount < 30) {

                setTimeout(
                  poll,
                  1000
                );

              }

              return;
            }


            finished = true;

            clearTimeout(timeout);

            cleanup();


            resolve(result);
          };


        const script =
          document.createElement('script');


        script.src =
          SCRIPT_URL +
          '?action=status' +
          '&requestId=' +
          encodeURIComponent(requestId) +
          '&callback=' +
          encodeURIComponent(callbackName);


        script.onerror =
          function() {

            cleanupJsonp(
              callbackName,
              script
            );


            if (!finished &&
                pollCount < 30) {

              setTimeout(
                poll,
                1000
              );
            }
          };


        document.body.appendChild(
          script
        );
      }


      function cleanupJsonp(
        callbackName,
        script
      ) {

        try {
          delete window[callbackName];
        } catch (error) {}

        if (
          script &&
          script.parentNode
        ) {
          script.parentNode.removeChild(
            script
          );
        }
      }


      function cleanup() {

        clearTimeout(timeout);

        if (
          form &&
          form.parentNode
        ) {
          form.parentNode.removeChild(
            form
          );
        }
      }


      poll();
    });
  }


  function addHidden(
    form,
    name,
    value
  ) {

    const input =
      document.createElement('input');

    input.type = 'hidden';

    input.name = name;

    input.value =
      value == null
        ? ''
        : String(value);

    form.appendChild(input);
  }


  /* =========================================
   * APPLICATION PAYLOAD
   * ========================================= */

  function getApplicationPayload() {

    return {

      name:
        document.getElementById(
          'appName'
        ).value.trim(),

      phone:
        document.getElementById(
          'appPhone'
        ).value.trim(),

      email:
        document.getElementById(
          'appEmail'
        ).value.trim(),

      position:
        document.getElementById(
          'position'
        ).value.trim(),

      expectedSalary:
        document.getElementById(
          'salary'
        ).value.trim(),

      startDate:
        document.getElementById(
          'startDate'
        ).value.trim(),

      houseNo:
        document.getElementById(
          'houseNo'
        ).value.trim(),

      moo:
        document.getElementById(
          'moo'
        ).value.trim(),

      road:
        document.getElementById(
          'road'
        ).value.trim(),

      subdistrict:
        document.getElementById(
          'subdistrict'
        ).value.trim(),

      district:
        document.getElementById(
          'district'
        ).value.trim(),

      province:
        document.getElementById(
          'appProvince'
        ).value.trim(),

      postalCode:
        document.getElementById(
          'postalCode'
        ).value.trim()
    };
  }


  /* =========================================
   * RESUME FILE -> BASE64
   * ========================================= */

  function fileToBase64(file) {

    return new Promise(function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          const result =
            String(reader.result || '');

          const comma =
            result.indexOf(',');


          if (comma === -1) {

            reject(
              new Error(
                'อ่านไฟล์ Resume ไม่สำเร็จ'
              )
            );

            return;
          }


          resolve(
            result.substring(
              comma + 1
            )
          );
        };


      reader.onerror =
        function() {

          reject(
            new Error(
              'ไม่สามารถอ่านไฟล์ Resume ได้'
            )
          );
        };


      reader.readAsDataURL(file);
    });
  }


  /* =========================================
   * APPLICATION SUBMIT
   * ========================================= */

  applicationForm.addEventListener(
    'submit',
    async function(event) {

      event.preventDefault();


      if (submitting) {
        return;
      }


      submitting = true;

      submitButton.disabled = true;

      submitButton.textContent =
        'กำลังส่ง...';

      clearStatus();


      try {

        let idToken;


        try {

          idToken =
            await getCurrentIdToken();

        } catch (tokenError) {

          if (
            tokenError.message ===
            'ID_TOKEN_EXPIRED_CLIENT'
          ) {

            handleTokenExpired();

            return;
          }

          throw tokenError;
        }


        const payload =
          getApplicationPayload();


        const result =
          await postToAppsScript(
            'application',
            payload,
            idToken
          );


        if (
          result.code ===
          'AUTH_EXPIRED'
        ) {

          handleTokenExpired();

          return;
        }


        if (!result.ok) {

          throw new Error(
            result.message ||
            'ไม่สามารถส่งใบสมัครได้'
          );
        }


        showStatus(
          result.message ||
          'ส่งใบสมัครสำเร็จ',
          'success'
        );


        applicationForm.reset();


      } catch (error) {

        console.error(error);

        showStatus(
          error.message ||
          'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง',
          'error'
        );

      } finally {

        submitting = false;

        submitButton.disabled =
          !liffReady;

        submitButton.textContent =
          'ส่งใบสมัคร';
      }
    }
  );


  /* =========================================
   * RESUME SUBMIT
   *
   * Resume is sent together with
   * the same "ส่งใบสมัคร" button.
   * ========================================= */

  const resumeFile =
    document.getElementById(
      'resumeFile'
    );


  async function getResumePayload() {

    const file =
      resumeFile.files[0];


    if (!file) {
      return null;
    }


    if (
      file.type !== 'image/jpeg' &&
      file.type !== 'image/png'
    ) {

      throw new Error(
        'รองรับเฉพาะ JPG / JPEG / PNG'
      );
    }


    if (
      file.size >
      10 * 1024 * 1024

  /*

  const originalSubmit =

<script>

  /* =========================================

  const LIFF_ID =

    'https://script.google.com/macros/s/AKfycbzo86xOy48YydkIGVeyd1t2L1dUdSqoERGoKBZvPLfspWA9dy6567ZHiG0Tjk2WTBph/exec';


  let liffReady = false;
  let submitting = false;


  /* =========================================
   * DOM
   * ========================================= */

  const applicationForm =
    document.getElementById('applicationForm');

  const submitButton =
    document.getElementById('submitButton');

    document.getElementById('status');

    document.getElementById('lineUser');

  /* =========================================
   * STATUS
   * ========================================= */

  function showStatus(message, type) {

    statusBox.textContent = message;

    statusBox.className =
      'status show ' + type;
  }


  function clearStatus() {

    statusBox.textContent = '';

    statusBox.className = 'status';
  }


  /* =========================================
   * INIT LIFF
   * ========================================= */

  async function initLIFF() {

    try {

      await liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      });


      /*
       * In LIFF browser:
       * login happens automatically during init.
       *
       * In external browser:
       * withLoginOnExternalBrowser=true
       * automatically starts login.
       */

      if (!liff.isLoggedIn()) {

        if (!liff.isInClient()) {

          liff.login({
            redirectUri: window.location.href
          });

          return;
        }

        throw new Error(
          'ยังไม่ได้เข้าสู่ระบบ LINE'
        );
      }


      /*
       * Get profile only for UI.
       *
       * IMPORTANT:
       * We do NOT send this profile to server
       * for authentication.
       */

      let profile = null;

      try {
        profile = await liff.getProfile();
      } catch (profileError) {
        console.warn(
          'getProfile failed',
          profileError
        );
      }


      if (profile) {

        lineUser.classList.remove('hidden');

        lineDisplayName.textContent =
          profile.displayName || 'ผู้ใช้ LINE';

        if (profile.pictureUrl) {

          linePicture.src =
            profile.pictureUrl;
        }
      }


      connectionStatus.textContent =
        'เชื่อมต่อ LINE สำเร็จ';

      submitButton.disabled = false;

      submitButton.textContent =
        'ส่งใบสมัคร';

      liffReady = true;


    } catch (error) {

      console.error(error);

      connectionStatus.textContent =
        'เชื่อมต่อ LINE ไม่สำเร็จ';

      submitButton.disabled = true;

      submitButton.textContent =
        'ไม่สามารถส่งข้อมูลได้';

      showStatus(
        'ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาเปิด LIFF ใหม่อีกครั้ง',
        'error'
      );
    }
  }


  /* =========================================
   * JWT EXPIRY CHECK
   * ========================================= */

  function getTokenExpiry(idToken) {

    try {

      const parts =
        idToken.split('.');

      if (parts.length !== 3) {
        return 0;
      }

      const payload =
        parts[1]
          .replace(/-/g, '+')
          .replace(/_/g, '/');

      const json =
        decodeURIComponent(
          atob(payload)
            .split('')
            .map(function(c) {
              return '%' +
                ('00' + c.charCodeAt(0).toString(16))
                  .slice(-2);
            })
            .join('')
        );

      return JSON.parse(json).exp || 0;

    } catch (error) {

      return 0;
    }
  }


  /* =========================================
   * GET ID TOKEN
   * ========================================= */

  async function getCurrentIdToken() {

    if (!liffReady) {
      throw new Error(
        'LIFF ยังเชื่อมต่อไม่เสร็จ'
      );
    }


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        'ไม่พบ LINE ID Token'
      );
    }


    const exp =
      getTokenExpiry(idToken);

    const now =
      Math.floor(Date.now() / 1000);


    /*
     * เหลือน้อยกว่า 60 วินาที
     * ถือว่าใกล้หมดอายุแล้ว
     */
    if (exp && exp <= now + 60) {

      throw new Error(
        'ID_TOKEN_EXPIRED_CLIENT'
      );
    }


    return idToken;
  }


  /* =========================================
   * HANDLE EXPIRED TOKEN
   * ========================================= */

  function handleTokenExpired() {

    /*
     * ถ้าเปิดจาก external browser
     * สามารถ logout แล้ว login ใหม่ได้
     */
    if (!liff.isInClient()) {

      try {

        liff.logout();

      } catch (error) {

        console.warn(error);
      }


      liff.login({
        redirectUri: window.location.href
      });

      return;
    }


    /*
     * ถ้าเปิดใน LIFF browser
     * liff.login() ใช้ไม่ได้
     *
     * ลอง reload 1 ครั้งเพื่อให้ LIFF init
     * สร้าง authentication state ใหม่
     */
    const reloaded =
      sessionStorage.getItem(
        'ATWORK_TOKEN_RELOAD'
      );


    if (!reloaded) {

      sessionStorage.setItem(
        'ATWORK_TOKEN_RELOAD',
        '1'
      );

      location.reload();

      return;
    }


    sessionStorage.removeItem(
      'ATWORK_TOKEN_RELOAD'
    );


    showStatus(
      'เซสชัน LINE หมดอายุแล้ว กรุณาปิดหน้านี้ แล้วเปิดแบบฟอร์ม ATWORK จาก LINE ใหม่อีกครั้ง',
      'error'
    );
  }


  /* =========================================
   * CREATE REQUEST ID
   * ========================================= */

  function createRequestId() {

    return (
      Date.now().toString(36) +
      '_' +
      Math.random()
        .toString(36)
        .slice(2)
    );
  }


  /* =========================================
   * SUBMIT TO APPS SCRIPT
   * ========================================= */

  function postToAppsScript(
    action,
    payload,
    idToken
  ) {

    return new Promise(function(
      resolve,
      reject
    ) {

      const requestId =
        createRequestId();


      const iframe =
        document.getElementById('postFrame');


      iframe.name = 'postFrame';


      const form =
        document.createElement('form');


      form.method = 'POST';

      form.action = SCRIPT_URL;

      form.target = 'postFrame';

      form.style.display = 'none';


      addHidden(
        form,
        'action',
        action
      );

      addHidden(
        form,
        'requestId',
        requestId
      );

      addHidden(
        form,
        'idToken',
        idToken
      );

      addHidden(
        form,
        'payload',
        JSON.stringify(payload)
      );


      document.body.appendChild(form);


      let finished = false;

      const timeout =
        setTimeout(function() {

          if (!finished) {

            finished = true;

            cleanup();

            reject(
              new Error(
                'การเชื่อมต่อ Server หมดเวลา'
              )
            );
          }

        }, 45000);


      form.submit();


      /*
       * ไม่ใช้ response จาก POST
       *
       * Poll ด้วย JSONP แทน
       * เพื่อหลีกเลี่ยง CORS
       */

      let pollCount = 0;


      function poll() {

        if (finished) {
          return;
        }


        pollCount++;


        const callbackName =
          '__atwork_' +
          Date.now() +
          '_' +
          Math.floor(
            Math.random() * 10000
          );


        window[callbackName] =
          function(result) {

            cleanupJsonp(
              callbackName,
              script
            );


            if (!result || result.pending) {

              if (pollCount < 30) {

                setTimeout(
                  poll,
                  1000
                );

              }

              return;
            }


            finished = true;

            clearTimeout(timeout);

            cleanup();


            resolve(result);
          };


        const script =
          document.createElement('script');


        script.src =
          SCRIPT_URL +
          '?action=status' +
          '&requestId=' +
          encodeURIComponent(requestId) +
          '&callback=' +
          encodeURIComponent(callbackName);


        script.onerror =
          function() {

            cleanupJsonp(
              callbackName,
              script
            );


            if (!finished &&
                pollCount < 30) {

              setTimeout(
                poll,
                1000
              );
            }
          };


        document.body.appendChild(
          script
        );
      }


      function cleanupJsonp(
        callbackName,
        script
      ) {

        try {
          delete window[callbackName];
        } catch (error) {}

        if (
          script &&
          script.parentNode
        ) {
          script.parentNode.removeChild(
            script
          );
        }
      }


      function cleanup() {

        clearTimeout(timeout);

        if (
          form &&
          form.parentNode
        ) {
          form.parentNode.removeChild(
            form
          );
        }
      }


      poll();
    });
  }


  function addHidden(
    form,
    name,
    value
  ) {

    const input =
      document.createElement('input');

    input.type = 'hidden';

    input.name = name;

    input.value =
      value == null
        ? ''
        : String(value);

    form.appendChild(input);
  }


  /* =========================================
   * APPLICATION PAYLOAD
   * ========================================= */

  function getApplicationPayload() {

    return {

      name:
        document.getElementById(

        document.getElementById(

      road:
        document.getElementById(

        ).value.trim(),

      subdistrict:
        document.getElementById(

        ).value.trim(),

      district:
        document.getElementById(

        ).value.trim(),

      province:
        document.getElementById(
          'appProvince'
        ).value.trim(),

      postalCode:
        document.getElementById(
          'postalCode'
        ).value.trim()
    };
  }


  /* =========================================
   * RESUME FILE -> BASE64
   * ========================================= */

  function fileToBase64(file) {

    return new Promise(function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          const result =
            String(reader.result || '');

          const comma =
            result.indexOf(',');


          if (comma === -1) {

            reject(
              new Error(
                'อ่านไฟล์ Resume ไม่สำเร็จ'
              )
            );

            return;
          }


          resolve(
            result.substring(
              comma + 1
            )
          );
        };


      reader.onerror =
        function() {

          reject(
            new Error(
              'ไม่สามารถอ่านไฟล์ Resume ได้'
            )
          );
        };


      reader.readAsDataURL(file);
    });
  }


  /* =========================================
   * APPLICATION SUBMIT
   * ========================================= */

  applicationForm.addEventListener(
    'submit',
    async function(event) {

      event.preventDefault();


      if (submitting) {
        return;
      }


      submitting = true;

      submitButton.disabled = true;

      submitButton.textContent =
        'กำลังส่ง...';

      clearStatus();


      try {

        let idToken;


        try {

          idToken =
            await getCurrentIdToken();

        } catch (tokenError) {

          if (
            tokenError.message ===
            'ID_TOKEN_EXPIRED_CLIENT'
          ) {

            handleTokenExpired();

            return;
          }

          throw tokenError;
        }


        const payload =
          getApplicationPayload();


        const result =
          await postToAppsScript(
            'application',
            payload,
            idToken
          );


        if (
          result.code ===
          'AUTH_EXPIRED'
        ) {

          handleTokenExpired();

          return;
        }


        if (!result.ok) {

          throw new Error(
            result.message ||
            'ไม่สามารถส่งใบสมัครได้'
          );
        }


        showStatus(
          result.message ||
          'ส่งใบสมัครสำเร็จ',
          'success'
        );


        applicationForm.reset();


      } catch (error) {

        console.error(error);

        showStatus(
          error.message ||
          'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง',
          'error'
        );

      } finally {

        submitting = false;

        submitButton.disabled =
          !liffReady;

        submitButton.textContent =
          'ส่งใบสมัคร';
      }
    }
  );


  /* =========================================
   * RESUME SUBMIT
   *
   * Resume is sent together with
   * the same "ส่งใบสมัคร" button.
   * ========================================= */

  const resumeFile =
    document.getElementById(
      'resumeFile'
    );


  async function getResumePayload() {

    const file =
      resumeFile.files[0];


    if (!file) {
      return null;
    }


    if (
      file.type !== 'image/jpeg' &&
      file.type !== 'image/png'
    ) {

      throw new Error(
        'รองรับเฉพาะ JPG / JPEG / PNG'
      );
    }


    if (
      file.size >
      10 * 1024 * 1024
    ) {

      throw new Error(
        'ไฟล์ Resume ต้องมีขนาดไม่เกิน 10 MB'
      );
    }


    const base64 =
      await fileToBase64(file);


    return {

      name:
        document.getElementById(
          'appName'
        ).value.trim(),

      phone:
        document.getElementById(
          'appPhone'
        ).value.trim(),

      jobType:
        document.getElementById(
          'jobType'
        ).value.trim(),

      province:
        document.getElementById(
          'resumeProvince'
        ).value.trim(),

      fileName:
        file.name,

      mimeType:
        file.type,

      fileSize:
        file.size,

      fileData:
        base64
    };
  }


  /*
   * เพิ่มการส่ง Resume หลังจาก Application
   * ด้วยปุ่มเดียว
   */

  const originalSubmit =
    applicationForm.onsubmit;


  applicationForm.addEventListener(
    'submit',
    function() {},
    true
  );


  /*
   * เราจัดการ Resume ก่อนการส่ง Application
   * ใน event handler เดียวด้านล่าง
   */

  applicationForm.addEventListener(
    'submit',
    async function(event) {

      /*
       * event นี้หยุดไว้เฉย ๆ
       * เพื่อไม่ให้มี handler ที่สองส่งซ้ำ
       */
    },
    true
  );


  /* =========================================
   * REPLACE MAIN SUBMIT HANDLER
   * ========================================= */

  applicationForm.addEventListener(
    'submit',
    function(event) {

      // ป้องกัน handler ซ้อน
      event.stopImmediatePropagation();

    },
    false
  );


  /*
   * เรียก init
   */
  initLIFF();

</script>

</body>
